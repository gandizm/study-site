<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="560" viewBox="0 0 1050 560" role="img" aria-labelledby="title"><title id="title">采集预处理特征提取匹配决策，检测不等于识别</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536d83"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17344c;font-size:24px} .small{font-size:21px;fill:#536d83} .head{font-size:32px;font-weight:700} .label{font-size:26px;font-weight:600}</style><rect width="100%" height="100%" fill="#fff"/><text x="35" y="55" class="head" text-anchor="start">图中有框，不代表身份已识别</text><rect x="35" y="110" width="210" height="115" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="140.0" y="158.5" class="label" text-anchor="middle">采集 + 预处理</text><text x="140.0" y="192.5" class="small" text-anchor="middle">清晰度 / 对齐</text><path d="M248 168L292 168" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="297" y="110" width="210" height="115" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="402.0" y="158.5" class="label" text-anchor="middle">定位 / 特征</text><text x="402.0" y="192.5" class="small" text-anchor="middle">找到区域与描述</text><path d="M510 168L553 168" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="558" y="110" width="210" height="115" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="663.0" y="158.5" class="label" text-anchor="middle">匹配 / 分类</text><text x="663.0" y="192.5" class="small" text-anchor="middle">与模型或模板比较</text><path d="M771 168L812 168" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="817" y="110" width="200" height="115" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="917.0" y="158.5" class="label" text-anchor="middle">检验结果</text><text x="917.0" y="192.5" class="small" text-anchor="middle">正确率 / 误报</text><text x="525" y="295" class="" text-anchor="middle">“检测”：哪里有目标？   “识别”：它属于谁或哪一类？</text><text x="525" y="355" class="" text-anchor="middle">原P13–18展示形状、车牌、指纹、人脸等应用</text><rect x="115" y="410" width="820" height="95" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="525.0" y="448.5" class="label" text-anchor="middle">实验条件决定证据强度</text><text x="525.0" y="482.5" class="small" text-anchor="middle">几张效果截图不提供数据集、误报率或泛化保证</text></svg>