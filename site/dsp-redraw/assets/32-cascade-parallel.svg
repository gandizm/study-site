<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="t d"><title id="t">级联与并联的系统函数关系</title><desc id="d">级联时系统函数相乘；并联时相加。</desc><metadata>{}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#16314a"/></marker></defs><rect width="960" height="720" fill="#fbfdff"/><g font-family="system-ui, Noto Sans CJK SC, sans-serif"><text x="40" y="42" font-size="30" fill="#16314a" text-anchor="start" font-weight="700">乘积用级联，和式用并联</text><text x="40" y="100" font-size="27" fill="#155eaa" text-anchor="start" font-weight="400">级联：H(z)=H₁(z)H₂(z)</text><text x="40" y="180" font-size="28" fill="#16314a" text-anchor="start" font-weight="400">x</text><line x1="70.00" y1="170.00" x2="200.00" y2="170.00" stroke="#16314a" stroke-width="2.5"/><polygon points="200,170 189.0,165.5 189.0,174.5" fill="#16314a"/><rect x="205" y="130" width="220" height="80" rx="8" fill="white" stroke="#155eaa" stroke-width="2.5"/><text x="315.0" y="179.0" font-size="25" fill="#155eaa" text-anchor="middle" font-weight="400">H₁(z)</text><line x1="430.00" y1="170.00" x2="520.00" y2="170.00" stroke="#16314a" stroke-width="2.5"/><polygon points="520,170 509.0,165.5 509.0,174.5" fill="#16314a"/><rect x="525" y="130" width="220" height="80" rx="8" fill="white" stroke="#155eaa" stroke-width="2.5"/><text x="635.0" y="179.0" font-size="25" fill="#155eaa" text-anchor="middle" font-weight="400">H₂(z)</text><line x1="750.00" y1="170.00" x2="875.00" y2="170.00" stroke="#16314a" stroke-width="2.5"/><polygon points="875,170 864.0,165.5 864.0,174.5" fill="#16314a"/><text x="895" y="180" font-size="28" fill="#16314a" text-anchor="start" font-weight="400">y</text><text x="40" y="295" font-size="27" fill="#087f79" text-anchor="start" font-weight="400">并联：H(z)=H₁(z)+H₂(z)</text><text x="40" y="440" font-size="28" fill="#16314a" text-anchor="start" font-weight="400">x</text><line x1="70.00" 