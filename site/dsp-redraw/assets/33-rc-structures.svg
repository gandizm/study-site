<svg xmlns="http://www.w3.org/2000/svg" width="940" height="720" viewBox="0 0 940 720" role="img" aria-labelledby="title desc"><title id="title">RC低通的两种数字实现</title><desc id="desc">冲激不变h(n)=ha(nT)给H1=α/(1-r z^-1)，r=e^-αT，其差分式y=r y旧+αx。双线性给H2=b(1+z^-1)/(1+a z^-1)，b=αT/(2+αT)，a=(αT-2)/(αT+2)，差分式y=b x+b x旧-a y旧。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#496172"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183545;font-size:24px} .small{font-size:20px;fill:#496172} .heading{font-size:31px;font-weight:700} .accent{fill:#087d8c} .warm{fill:#aa4b20} .math{font-family:"DejaVu Sans","Noto Sans CJK SC",sans-serif}</style><rect width="100%" height="100%" fill="#fcfdfb"/><text x="32" y="49" class="heading" text-anchor="start">原 RC 例：两种转换，两个不同的差分方程</text><text x="32" y="92" class="small math" text-anchor="start">h(n)=hₐ(nT)：y(n)=αx(n)+r y(n−1)，r=exp(−αT)</text><text x="30" y="168" class="math" text-anchor="start">x(n)</text><line x1="93" y1="160" x2="150" y2="160" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="155" y="133" width="125" height="54" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="217.5" y="168" class="small math" text-anchor="middle">×α</text><line x1="280" y1="160" x2="420" y2="160" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><circle cx="447" cy="160" r="24" fill="white" stroke="#496172" stroke-width="2"/><text x="447" y="168" class="math" text-anchor="middle">+</text><line x1="472" y1="160" x2="820" y2="160" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><text x="837" y="168" class="math" text-anchor="start">y(n)</text><circle cx="770" cy="160" r="4" fill="#087d8c"/><path d="M770 160 V262 H702" fill="none" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="575" y="235" width="122" height="54" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="636.0" y="270" class="small math" text-anchor="middle">z⁻¹</text><line x1="575" y1="262" x2="510" y2="262" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="375" y="235" width="130" height="54" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="440.0" y="270" class="small math" text-anchor="middle">×r</text><path d="M375 262 H330 V210 H447 V185" fill="none" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="365" class="small math" text-anchor="start">双线性：y(n)=b x(n)+b x(n−1)−a y(n−1)</text><text x="30" y="438" class="math" text-anchor="start">x(n)</text><line x1="93" y1="430" x2="150" y2="430" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="155" y="403" width="125" height="54" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="217.5" y="438" class="small math" text-anchor="middle">×b</text><line x1="280" y1="430" x2="510" y2="430" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><circle cx="537" cy="430" r="24" fill="white" stroke="#496172" stroke-width="2"/><text x="537" y="438" class="math" text-anchor="middle">+</text><line x1="562" y1="430" x2="820" y2="430" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><text x="837" y="438" class="math" text-anchor="start">y(n)</text><circle cx="119" cy="430" r="4" fill="#087d8c"/><path d="M119 430 V535 H155" fill="none" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="160" y="508" width="120" height="54" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="220.0" y="543" class="small math" text-anchor="middle">z⁻¹</text><line x1="280" y1="535" x2="335" y2="535" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="508" width="120" height="54" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="400.0" y="543" class="small math" text-anchor="middle">×b</text><line x1="460" y1="535" x2="513" y2="535" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><circle cx="537" cy="535" r="22" fill="white" stroke="#496172" stroke-width="2"/><text x="537" y="543" class="math" text-anchor="middle">+</text><line x1="537" y1="513" x2="537" y2="455" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><circle cx="780" cy="430" r="4" fill="#087d8c"/><path d="M780 430 V630 H720" fill="none" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="595" y="603" width="120" height="54" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="655.0" y="638" class="small math" text-anchor="middle">z⁻¹</text><line x1="595" y1="630" x2="540" y2="630" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="415" y="603" width="120" height="54" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="475.0" y="638" class="small math" text-anchor="middle">×(−a)</text><path d="M415 630 H315 V580 H537 V559" fill="none" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="699" class="small math" text-anchor="start">b=αT/(2+αT)，a=(αT−2)/(αT+2)。每个 z⁻¹ 都延迟一个采样间隔。</text></svg>