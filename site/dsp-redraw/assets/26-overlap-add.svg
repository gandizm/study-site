<svg xmlns="http://www.w3.org/2000/svg" width="900" height="575" viewBox="0 0 900 575" role="img" aria-labelledby="title desc"><title id="title">重叠相加原例2.6.2</title><desc id="desc">h为1,2，输入为从n0开始的全1序列。每块3项输入与h卷积得到1,3,3,2。各块输出按3个样本平移并在重叠处相加，第3位置2加1等于3。图示前三块及第四块起点n9，结果从n0起为1,3,3,3，后续全3。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#496172"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183545;font-size:24px} .small{font-size:20px;fill:#496172} .heading{font-size:31px;font-weight:700} .accent{fill:#087d8c} .warm{fill:#aa4b20} .math{font-family:"DejaVu Sans","Noto Sans CJK SC",sans-serif}</style><rect width="100%" height="100%" fill="#fcfdfb"/><text x="32" y="49" class="heading" text-anchor="start">重叠相加：输出移 3 点，却有 4 点长</text><text x="32" y="90" class="small math" text-anchor="start">原例 2.6.2：h={1,2}，x={1,1,1,…}，每块 M=3，L=4</text><text x="230" y="139" class="small" text-anchor="middle">0</text><text x="295" y="139" class="small" text-anchor="middle">1</text><text x="360" y="139" class="small" text-anchor="middle">2</text><text x="425" y="139" class="small" text-anchor="middle">3</text><text x="490" y="139" class="small" text-anchor="middle">4</text><text x="555" y="139" class="small" text-anchor="middle">5</text><text x="620" y="139" class="small" text-anchor="middle">6</text><text x="685" y="139" class="small" text-anchor="middle">7</text><text x="750" y="139" class="small" text-anchor="middle">8</text><text x="815" y="139" class="small" text-anchor="middle">9</text><text x="35" y="139" class="small" text-anchor="start">全局下标 n</text><text x="32" y="204" class="small" text-anchor="start">第0块输出</text><rect x="206" y="169" width="48" height="48" rx="12" fill="#fff0e5" stroke="#adc5c2"/><text x="230" y="203" class="math" text-anchor="middle">1</text><rect x="271" y="169" width="48" height="48" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="295" y="203" class="math" text-anchor="middle">3</text><rect x="336" y="169" width="48" height="48" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="360" y="203" class="math" text-anchor="middle">3</text><rect x="401" y="169" width="48" height="48" rx="12" fill="#fff0e5" stroke="#adc5c2"/><text x="425" y="203" class="math" text-anchor="middle">2</text><text x="32" y="279" class="small" text-anchor="start">第1块输出</text><rect x="401" y="244" width="48" height="48" rx="12" fill="#fff0e5" stroke="#adc5c2"/><text x="425" y="278" class="math" text-anchor="middle">1</text><rect x="466" y="244" width="48" height="48" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="490" y="278" class="math" text-anchor="middle">3</text><rect x="531" y="244" width="48" height="48" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="555" y="278" class="math" text-anchor="middle">3</text><rect x="596" y="244" width="48" height="48" rx="12" fill="#fff0e5" stroke="#adc5c2"/><text x="620" y="278" class="math" text-anchor="middle">2</text><text x="32" y="354" class="small" text-anchor="start">第2块输出</text><rect x="596" y="319" width="48" height="48" rx="12" fill="#fff0e5" stroke="#adc5c2"/><text x="620" y="353" class="math" text-anchor="middle">1</text><rect x="661" y="319" width="48" height="48" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="685" y="353" class="math" text-anchor="middle">3</text><rect x="726" y="319" width="48" height="48" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="750" y="353" class="math" text-anchor="middle">3</text><rect x="791" y="319" width="48" height="48" rx="12" fill="#fff0e5" stroke="#adc5c2"/><text x="815" y="353" class="math" text-anchor="middle">2</text><text x="32" y="429" class="small" text-anchor="start">第3块开始…</text><rect x="791" y="394" width="48" height="48" rx="12" fill="#fff0e5" stroke="#adc5c2"/><text x="815" y="429" class="math" text-anchor="middle">1</text><line x1="203" y1="464" x2="864" y2="464" stroke="#496172" stroke-width="2"/><text x="32" y="511" class="accent" text-anchor="start">相加结果</text><text x="230" y="511" class="math" text-anchor="middle">1</text><text x="295" y="511" class="math" text-anchor="middle">3</text><text x="360" y="511" class="math" text-anchor="middle">3</text><text x="425" y="511" class="math" text-anchor="middle">3</text><text x="490" y="511" class="math" text-anchor="middle">3</text><text x="555" y="511" class="math" text-anchor="middle">3</text><text x="620" y="511" class="math" text-anchor="middle">3</text><text x="685" y="511" class="math" text-anchor="middle">3</text><text x="750" y="511" class="math" text-anchor="middle">3</text><text x="815" y="511" class="math" text-anchor="middle">3</text><text x="32" y="557" class="small" text-anchor="start">重叠处 2+1=3；只拼接成 1,3,3,2,1,3,3,2,… 就错了。</text></svg>