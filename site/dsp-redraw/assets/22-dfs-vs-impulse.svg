<svg xmlns="http://www.w3.org/2000/svg" width="640" height="745" viewBox="0 0 640 745" role="img" aria-labelledby="title desc"><title id="title">22-dfs-vs-impulse</title><desc id="desc">N=4周期余弦的DFS为0,4,0,4，对应数字角频率±π/2的DTFT冲激，权重均为2π。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17253b"/></marker></defs><rect width="640" height="745" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="42" font-size="29" fill="#17253b" text-anchor="start" font-weight="700">同一序列：2cos(πn/2)</text><text x="30" y="89" font-size="25" fill="#1768be" text-anchor="start" font-weight="400">N = 4，独立DFS系数</text><line x1="65.00" y1="235.00" x2="600.00" y2="235.00" stroke="#17253b" stroke-width="2" marker-end="url(#arrow)"/><circle cx="100.00" cy="235.00" r="6" fill="#1768be" stroke="#1768be" stroke-width="2"/><text x="100.0" y="271" font-size="25" fill="#52637b" text-anchor="middle" font-weight="400">0</text><line x1="251.67" y1="235.00" x2="251.67" y2="140.00" stroke="#1768be" stroke-width="4"/><circle cx="251.67" cy="140.00" r="6" fill="#1768be" stroke="#1768be" stroke-width="2"/><text x="251.66666666666666" y="271" font-size="25" fill="#52637b" text-anchor="middle" font-weight="400">1</text><text x="251.66666666666666" y="123" font-size="28" fill="#1768be" text-anchor="middle" font-weight="400">4</text><circle cx="403.33" cy="235.00" r="6" fill="#1768be" stroke="#1768be" stroke-width="2"/><text x="403.3333333333333" y="271" font-size="25" fill="#52637b" text-anchor="middle" font-weight="400">2</text><line x1="555.00" y1="235.00" x2="555.00" y2="140.00" stroke="#1768be" stroke-width="4"/><circle cx="555.00" cy="140.00" r="6" fill="#1768be" stroke="#1768be" stroke-width="2"/><text x="555.0" y="271" font-size="25" fill="#52637b" text-anchor="middle" font-weight="400">3</text><text x="555.0" y="123" font-size="28" fill="#1768be" text-anchor="middle" font-weight="400">4</text><text x="605" y="270" font-size="24" fill="#17253b" text-anchor="start" font-weight="400">k</text><text x="320" y="320" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">按N=4重复；圆点是有限系数</text><text x="30" y="380" font-size="25" fill="#087c76" text-anchor="start" font-weight="400">DTFT：一周期 [−π, π)</text><line x1="65.00" y1="535.00" x2="605.00" y2="535.00" stroke="#17253b" stroke-width="2" marker-end="url(#arrow)"/><line x1="195.00" y1="535.00" x2="195.00" y2="435.00" stroke="#087c76" stroke-width="4" marker-end="url(#arrow)"/><text x="195" y="415" font-size="28" fill="#087c76" text-anchor="middle" font-weight="400">2π</text><line x1="455.00" y1="535.00" x2="455.00" y2="435.00" stroke="#087c76" stroke-width="4" marker-end="url(#arrow)"/><text x="455" y="415" font-size="28" fill="#087c76" text-anchor="middle" font-weight="400">2π</text><line x1="65.00" y1="531.00" x2="65.00" y2="540.00" stroke="#52637b" stroke-width="2"/><text x="65" y="569" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">−π</text><line x1="195.00" y1="531.00" x2="195.00" y2="540.00" stroke="#52637b" stroke-width="2"/><text x="195.0" y="569" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">−π/2</text><line x1="325.00" y1="531.00" x2="325.00" y2="540.00" stroke="#52637b" stroke-width="2"/><text x="325.0" y="569" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">0</text><line x1="455.00" y1="531.00" x2="455.00" y2="540.00" stroke="#52637b" stroke-width="2"/><text x="455.0" y="569" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">π/2</text><line x1="585.00" y1="531.00" x2="585.00" y2="540.00" stroke="#52637b" stroke-width="2"/><text x="585" y="569" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">π</text><text x="610" y="570" font-size="23" fill="#17253b" text-anchor="start" font-weight="400">ω</text><text x="320" y="625" font-size="26" fill="#17253b" text-anchor="middle" font-weight="400">冲激权重 = (2π/N) × DFS系数</text><text x="320" y="670" font-size="29" fill="#17253b" text-anchor="middle" font-weight="700">(2π/4) × 4 = 2π</text><text x="320" y="715" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">箭头不是“高度”；每2π周期重复</text></g></svg>