<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">FFT计算线性卷积的补零流程</title><desc id="desc">长度Nx和Nh的两个输入先补零到同一个L，要求L不小于Nx加Nh减1。分别做L点FFT，频域逐点相乘，L点IFFT，再保留有效线性卷积区间。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#496172"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183545;font-size:24px} .small{font-size:20px;fill:#496172} .heading{font-size:31px;font-weight:700} .accent{fill:#087d8c} .warm{fill:#aa4b20} .math{font-family:"DejaVu Sans","Noto Sans CJK SC",sans-serif}</style><rect width="100%" height="100%" fill="#fcfdfb"/><text x="32" y="49" class="heading" text-anchor="start">要线性卷积，先让环绕没有机会相撞</text><text x="32" y="89" class="math" text-anchor="start">x 长 Nₓ，h 长 Nₕ；选择 L ≥ Nₓ + Nₕ − 1</text><text x="35" y="185" class="math" text-anchor="start">x(n)</text><line x1="100" y1="177" x2="140" y2="177" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="145" y="145" width="152" height="65" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="221" y="186" class="math" text-anchor="middle">补零到 L</text><line x1="298" y1="177" x2="338" y2="177" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="343" y="145" width="145" height="65" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="415" y="186" class="math" text-anchor="middle">L 点 FFT</text><line x1="488" y1="177" x2="553" y2="245" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="328" class="math" text-anchor="start">h(n)</text><line x1="100" y1="320" x2="140" y2="320" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="145" y="288" width="152" height="65" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="221" y="329" class="math" text-anchor="middle">补零到 L</text><line x1="298" y1="320" x2="338" y2="320" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="343" y="288" width="145" height="65" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="415" y="329" class="math" text-anchor="middle">L 点 FFT</text><line x1="488" y1="320" x2="553" y2="245" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><circle cx="580" cy="245" r="25" fill="white" stroke="#496172" stroke-width="2"/><text x="580" y="254" class="math" text-anchor="middle">×</text><line x1="607" y1="245" x2="655" y2="245" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="211" width="195" height="70" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="758" y="254" class="math" text-anchor="middle">L 点 IFFT</text><text x="661" y="323" class="small" text-anchor="start">保留前 Nₓ+Nₕ−1 项</text><text x="32" y="415" class="small" text-anchor="start">同一个 L、逐频点相乘、逆变换归一化；缺少补零得到的是循环卷积。</text></svg>