<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">OFDM的IFFT发送与FFT接收</title><desc id="desc">数据最初是子载波系数A(k)。发送端IFFT把系数组合成时域s(n)，理想同步信道后接收端FFT恢复A(k)。实际链路还需要编码调制、数模模数转换、射频、同步、循环前缀和均衡等，本图只保留DFT角色。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#496172"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183545;font-size:24px} .small{font-size:20px;fill:#496172} .heading{font-size:31px;font-weight:700} .accent{fill:#087d8c} .warm{fill:#aa4b20} .math{font-family:"DejaVu Sans","Noto Sans CJK SC",sans-serif}</style><rect width="100%" height="100%" fill="#fcfdfb"/><text x="32" y="49" class="heading" text-anchor="start">OFDM：发送端先有系数，需要合成波形</text><rect x="32" y="118" width="222" height="95" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="143" y="154" class="math" text-anchor="middle">A(k)</text><text x="143" y="191" class="small" text-anchor="middle">子载波系数</text><line x1="255" y1="164" x2="332" y2="164" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="338" y="118" width="222" height="95" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="449" y="154" class="math" text-anchor="middle">IFFT</text><text x="449" y="191" class="small" text-anchor="middle">合成时域样本</text><line x1="561" y1="164" x2="638" y2="164" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="644" y="118" width="222" height="95" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="755" y="154" class="math" text-anchor="middle">s(n)</text><text x="755" y="191" class="small" text-anchor="middle">发送波形</text><line x1="755" y1="213" x2="755" y2="290" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><text x="510" y="260" class="small" text-anchor="start">理想同步、无失真链路</text><rect x="644" y="292" width="222" height="95" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="755" y="328" class="math" text-anchor="middle">s(n)</text><text x="755" y="366" class="small" text-anchor="middle">接收样本</text><line x1="644" y1="338" x2="566" y2="338" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="338" y="292" width="222" height="95" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="449" y="328" class="math" text-anchor="middle">FFT</text><text x="449" y="366" class="small" text-anchor="middle">提取各基系数</text><line x1="338" y1="338" x2="260" y2="338" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="292" width="222" height="95" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="143" y="328" class="math" text-anchor="middle">A(k)</text><text x="143" y="366" class="small" text-anchor="middle">恢复子载波数据</text></svg>