<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-labelledby="title desc"><title id="title">FIR有限冲激响应与对称性</title><desc id="desc">示例五点偶对称冲激响应1,2,3,2,1。配对后H等于exp(-j2ω)乘以3加4cosω加2cos2ω。实有符号幅度变号可带来π相位跳变，非零响应频率处群时延2。不是所有FIR自动线性相位。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#496172"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183545;font-size:24px} .small{font-size:20px;fill:#496172} .heading{font-size:31px;font-weight:700} .accent{fill:#087d8c} .warm{fill:#aa4b20} .math{font-family:"DejaVu Sans","Noto Sans CJK SC",sans-serif}</style><rect width="100%" height="100%" fill="#fcfdfb"/><text x="32" y="48" class="heading" text-anchor="start">有限长保证稳定；对称性才带来线性相位</text><line x1="82" y1="270.0" x2="526" y2="270.0" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><line x1="90.0" y1="270.0" x2="90.0" y2="221.42857142857144" stroke="#087d8c" stroke-width="2"/><circle cx="90.0" cy="221.42857142857144" r="4" fill="#087d8c"/><text x="90.0" y="297" class="small" text-anchor="middle">0</text><line x1="195.0" y1="270.0" x2="195.0" y2="172.85714285714286" stroke="#087d8c" stroke-width="2"/><circle cx="195.0" cy="172.85714285714286" r="4" fill="#087d8c"/><text x="195.0" y="297" class="small" text-anchor="middle">1</text><line x1="300.0" y1="270.0" x2="300.0" y2="124.2857142857143" stroke="#087d8c" stroke-width="2"/><circle cx="300.0" cy="124.2857142857143" r="4" fill="#087d8c"/><text x="300.0" y="297" class="small" text-anchor="middle">2</text><line x1="405.0" y1="270.0" x2="405.0" y2="172.85714285714286" stroke="#087d8c" stroke-width="2"/><circle cx="405.0" cy="172.85714285714286" r="4" fill="#087d8c"/><text x="405.0" y="297" class="small" text-anchor="middle">3</text><line x1="510.0" y1="270.0" x2="510.0" y2="221.42857142857144" stroke="#087d8c" stroke-width="2"/><circle cx="510.0" cy="221.42857142857144" r="4" fill="#087d8c"/><text x="510.0" y="297" class="small" text-anchor="middle">4</text><line x1="300" y1="95" x2="300" y2="302" stroke="#adc5c2" stroke-width="1" stroke-dasharray="7 6"/><text x="300" y="334" class="small" text-anchor="middle">对称中心 α=2</text><text x="590" y="148" class="math" text-anchor="start">h(0)=h(4)</text><text x="590" y="195" class="math" text-anchor="start">h(1)=h(3)</text><text x="590" y="242" class="small" text-anchor="start">实系数，偶对称</text><text x="45" y="393" class="math" text-anchor="start">H(e<tspan baseline-shift="super" font-size="75%">jω</tspan>) = exp(−j2ω) · [3+4cosω+2cos2ω]</text><text x="45" y="443" class="small" text-anchor="start">exp(−j2ω)：固定时延2</text><text x="440" y="443" class="small" text-anchor="start">括号内实幅度：变号时相位跳π</text><text x="32" y="496" class="small" text-anchor="start">群时延只在 H≠0、相位可定义的频段谈；零点处不能硬说相位连续。</text></svg>