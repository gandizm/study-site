<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="t d"><title id="t">原P39修复后的三支路并联结构</title><desc id="d">直接支路1，加负6除以1减q，加6加4q除以1减q减q平方。</desc><metadata>{&quot;numerators&quot;: [[1], [-6], [6, 4]], &quot;denominators&quot;: [[1], [1, -1], [1, -1, -1]], &quot;qCheck&quot;: 0.5, &quot;expected&quot;: 21}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#16314a"/></marker></defs><rect width="960" height="760" fill="#fbfdff"/><g font-family="system-ui, Noto Sans CJK SC, sans-serif"><text x="40" y="42" font-size="30" fill="#16314a" text-anchor="start" font-weight="700">原 P39 纠正：三个支路相加才等于原系统</text><text x="40" y="94" font-size="24" fill="#b45412" text-anchor="start" font-weight="400">q = z⁻¹；第一动态支路 −6，第二动态支路常数 +6</text><text x="30" y="360" font-size="25" fill="#16314a" text-anchor="start" font-weight="400">x(n)</text><line x1="100.00" y1="350.00" x2="145.00" y2="350.00" stroke="#16314a" stroke-width="2.5"/><polygon points="145,350 134.0,345.5 134.0,354.5" fill="#16314a"/><circle cx="150" cy="350" r="4" fill="#16314a"/><path d="M150 350 L150 180 L255 180" fill="none" stroke="#16314a" stroke-width="2.5"/><polygon points="255.0,180.0 244.0,175.5 244.0,184.5" fill="#16314a"/><rect x="260" y="130" width="490" height="100" rx="8" fill="white" stroke="#087f79" stroke-width="2.5"/><text x="505" y="190" font-size="30" fill="#087f79" text-anchor="middle" font-weight="400">1</text><path d="M755 180 L850 180 L850 325" fill="none" stroke="#16314a" stroke-width="2.5"/><polygon points="850.0,325.0 854.5,314.0 845.5,314.0" fill="#16314a"/><path d="M150 350 L150 350 L255 350" fill="none" stroke="#16314a" stroke-width="2.5"/><polygon points="255.0,350.0 244.0,345.5 244.0,354.5" fill="#16314a"/><rect x="260" y="300" width="490" height="100" rx="8" fill="white" stroke="#087f79" stroke-width="2.5"/><text x="505" y="335" font-size="27" fill="#087f79" text-anchor="middle" font-weight="400">−6</text><line x1="410.00" y1="350.00" x2="600.00" y2="350.00" stroke="#087f79" stroke-width="2"/><text x="505" y="385" font-size="27" fill="#087f79" text-anchor="middle" font-weight="400">1 − q</text><path d="M755 350 L825 350" fill="none" stroke="#16314a" stroke-width="2.5"/><polygon points="825.0,350.0 814.0,345.5 814.0,354.5" fill="#16314a"/><path d="M150 350 L150 520 L255 520" fill="none" stroke="#16314a" stroke-width="2.5"/><polygon points="255.0,520.0 244.0,515.5 244.0,524.5" fill="#16314a"/><rect x="260" y="470" width="490" height="100" rx="8" fill="white" stroke="#087f79" stroke-width="2.5"/><text x="505" y="505" font-size="27" fill="#087f79" text-anchor="middle" font-weight="400">6 + 4q</text><line x1="370.00" y1="520.00" x2="640.00" y2="520.00" stroke="#087f79" stroke-width="2"/><text x="505" y="555" font-size="27" fill="#087f79" text-anchor="middle" font-weight="400">1 − q − q²</text><path d="M755 520 L850 520 L850 375" fill="none" stroke="#16314a" stroke-width="2.5"/><polygon points="850.0,375.0 845.5,386.0 854.5,386.0" fill="#16314a"/><circle cx="850" cy="350" r="23" fill="white" stroke="#16314a" stroke-width="2.5"/><text x="850" y="359" font-size="30" fill="#16314a" text-anchor="middle" font-weight="400">+</text><line x1="875.00" y1="350.00" x2="930.00" y2="350.00" stroke="#16314a" stroke-width="2.5"/><polygon points="930,350 919.0,345.5 919.0,354.5" fill="#16314a"/><text x="890" y="405" font-size="25" fill="#16314a" text-anchor="start" font-weight="400">y(n)</text><text x="40" y="625" font-size="25" fill="#16314a" text-anchor="start" font-weight="400">核验 q=0.5：1 − 12 + 32 = 21，与原有理式一致。</text><text x="40" y="675" font-size="23" fill="#b45412" text-anchor="start" font-weight="400">原PPT误式会给 −3；各支路必须带着系数符号接入加法器。</text><text x="40" y="720" font-size="23" fill="#577082" text-anchor="start" font-weight="400">此例含单位圆上及外部极点，不是稳定因果滤波器的设计结果。</text></g></svg>