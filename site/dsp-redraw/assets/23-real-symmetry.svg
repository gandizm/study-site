<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">四点实序列的频谱共轭配对</title><desc id="desc">频点1与3互为共轭；0和2与自己配对，频谱值为实数。</desc><metadata>{&quot;input&quot;: [1, 2, 0, 0], &quot;dft&quot;: [[3, 0], [1, -2], [-1, 0], [1, 2]]}</metadata><rect width="960" height="460" fill="#fbfdff"/><g font-family="system-ui, Noto Sans CJK SC, sans-serif"><text x="45" y="42" font-size="30" fill="#16314a" text-anchor="start" font-weight="700">实序列 → 频谱成对共轭，而非全实</text><text x="45" y="91" font-size="26" fill="#16314a" text-anchor="start" font-weight="400">x = [1, 2, 0, 0]；X = [3, 1−2j, −1, 1+2j]</text><circle cx="140.00" cy="210.00" r="43" fill="#087f79"/><text x="140" y="218" font-size="27" fill="white" text-anchor="middle" font-weight="400">0</text><text x="140" y="297" font-size="28" fill="#16314a" text-anchor="middle" font-weight="400">3</text><circle cx="350.00" cy="210.00" r="43" fill="#155eaa"/><text x="350" y="218" font-size="27" fill="white" text-anchor="middle" font-weight="400">1</text><text x="350" y="297" font-size="28" fill="#16314a" text-anchor="middle" font-weight="400">1−2j</text><circle cx="560.00" cy="210.00" r="43" fill="#087f79"/><text x="560" y="218" font-size="27" fill="white" text-anchor="middle" font-weight="400">2</text><text x="560" y="297" font-size="28" fill="#16314a" text-anchor="middle" font-weight="400">−1</text><circle cx="770.00" cy="210.00" r="43" fill="#155eaa"/><text x="770" y="218" font-size="27" fill="white" text-anchor="middle" font-weight="400">3</text><text x="770" y="297" font-size="28" fill="#16314a" text-anchor="middle" font-weight="400">1+2j</text><line x1="350.00" y1="150.00" x2="770.00" y2="150.00" stroke="#155eaa" stroke-width="3"/><line x1="350.00" y1="150.00" x2="350.00" y2="165.00" stroke="#155eaa" stroke-width="3"/><line x1="770.00" y1="150.00" x2="770.00" y2="165.00" stroke="#155eaa" stroke-width="3"/><text x="560" y="134" font-size="25" fill="#155eaa" text-anchor="middle" font-weight="400">共轭配对</text><text x="140" y="365" font-size="23" fill="#087f79" text-anchor="middle" font-weight="400">k = 0 自配对</text><text x="560" y="365" font-size="23" fill="#087f79" text-anchor="middle" font-weight="400">k = N/2 自配对</text><text x="45" y="420" font-size="24" fill="#577082" text-anchor="start" font-weight="400">自配对频点必为实数；实数可以是负数，也不必是 0。</text></g></svg>