<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">DIT蝶形：一次乘法供两个输出</title><desc id="desc">A为偶位置子序列的DFT，B为奇位置子序列的DFT。先算t等于W_N的k次方乘B，再输出A+t与A-t。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#496172"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183545;font-size:24px} .small{font-size:20px;fill:#496172} .heading{font-size:31px;font-weight:700} .accent{fill:#087d8c} .warm{fill:#aa4b20} .math{font-family:"DejaVu Sans","Noto Sans CJK SC",sans-serif}</style><rect width="100%" height="100%" fill="#fcfdfb"/><text x="32" y="49" class="heading" text-anchor="start">DIT：先乘，再共享给一加一减</text><text x="32" y="85" class="small math" text-anchor="start">0 ≤ k &lt; N/2；W<tspan baseline-shift="sub" font-size="75%">N</tspan> = exp(−j2π/N)</text><rect x="32" y="134" width="170" height="66" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="117" y="177" class="math" text-anchor="middle">A = X₁(k)</text><rect x="32" y="290" width="170" height="66" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="117" y="333" class="math" text-anchor="middle">B = X₂(k)</text><rect x="270" y="290" width="192" height="66" rx="12" fill="#fff0e5" stroke="#d3ab89"/><text x="366" y="333" class="math" text-anchor="middle">t = W<tspan baseline-shift="sub" font-size="75%">N</tspan>ᵏ B</text><line x1="202" y1="323" x2="270" y2="323" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><line x1="202" y1="167" x2="545" y2="167" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><line x1="462" y1="323" x2="545" y2="167" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><line x1="202" y1="167" x2="545" y2="323" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><line x1="462" y1="323" x2="545" y2="323" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><circle cx="570" cy="167" r="25" fill="white" stroke="#496172" stroke-width="2"/><text x="570" y="175" class="math" text-anchor="middle">+</text><line x1="596" y1="167" x2="658" y2="167" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><circle cx="570" cy="323" r="25" fill="white" stroke="#496172" stroke-width="2"/><text x="570" y="331" class="math" text-anchor="middle">−</text><line x1="596" y1="323" x2="658" y2="323" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><text x="678" y="161" class="math" text-anchor="start">X(k) = A + t</text><text x="678" y="198" class="small" text-anchor="start">前半频点</text><text x="678" y="315" class="math" text-anchor="start">A − t</text><text x="678" y="352" class="math" text-anchor="start">X(k + N/2)</text><text x="32" y="421" class="small" text-anchor="start">一次复乘 + 两次复加/减；“−”节点表示 A − t，不重复减号。</text></svg>