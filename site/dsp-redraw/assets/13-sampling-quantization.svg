<svg xmlns="http://www.w3.org/2000/svg" width="640" height="355" viewBox="0 0 640 355" role="img" aria-labelledby="title"><title id="title">模拟采样量化三阶段</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#172e41"/></marker></defs><rect width="640" height="355" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="24" y="34" font-size="27" fill="#172e41" text-anchor="start" font-weight="bold">时间离散 ≠ 幅度已经量化</text><rect x="36" y="72" width="160" height="70" rx="10" fill="#eaf5f6" stroke="#176879" stroke-width="2"/><text x="116.0" y="115.0" font-size="24" fill="#176879" text-anchor="middle" font-weight="normal">模拟 xₐ(t)</text><line x1="205" y1="107" x2="240" y2="107" stroke="#172e41" stroke-width="2" marker-end="url(#arrow)"/><rect x="250" y="72" width="160" height="70" rx="10" fill="#eaf5f6" stroke="#176879" stroke-width="2"/><text x="330.0" y="115.0" font-size="24" fill="#176879" text-anchor="middle" font-weight="normal">采样 x[n]</text><line x1="418" y1="107" x2="450" y2="107" stroke="#172e41" stroke-width="2" marker-end="url(#arrow)"/><rect x="460" y="72" width="150" height="70" rx="10" fill="#eaf5f6" stroke="#176879" stroke-width="2"/><text x="535.0" y="115.0" font-size="24" fill="#176879" text-anchor="middle" font-weight="normal">量化编码</text><text x="116" y="178" font-size="22" fill="#566b7a" text-anchor="middle" font-weight="normal">所有时刻</text><text x="330" y="178" font-size="22" fill="#566b7a" text-anchor="middle" font-weight="normal">n 是整数</text><text x="535" y="178" font-size="22" fill="#566b7a" text-anchor="middle" font-weight="normal">有限幅度级</text><text x="34" y="230" font-size="25" fill="#172e41" text-anchor="start" font-weight="normal">T：秒/样本；fₛ=1/T：样本/秒</text><text x="34" y="276" font-size="25" fill="#176879" text-anchor="start" font-weight="normal">x[n]=xₐ(nT)，ω₀=2πf₀/fₛ</text><text x="34" y="322" font-size="23" fill="#172e41" text-anchor="start" font-weight="normal">采样改变时间索引；量化引入幅度误差。</text></g></svg>