<svg xmlns="http://www.w3.org/2000/svg" width="640" height="615" viewBox="0 0 640 615" role="img" aria-labelledby="title"><title id="title">自然矩形采样与单位面积理想冲激的区别</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#172e41"/></marker></defs><rect width="640" height="615" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="24" y="36" font-size="25" fill="#172e41" text-anchor="start" font-weight="bold">自然采样与理想冲激：不能混成同一种</text><text x="24" y="86" font-size="23" fill="#176879" text-anchor="start" font-weight="normal">自然采样：宽 τ、高 1 的周期门函数</text><polyline points="50.00,215.00 50.00,130.00 80.00,130.00 80.00,215.00 165.00,215.00" fill="none" stroke="#176879" stroke-width="3" /><polyline points="165.00,215.00 165.00,130.00 195.00,130.00 195.00,215.00 280.00,215.00" fill="none" stroke="#176879" stroke-width="3" /><polyline points="280.00,215.00 280.00,130.00 310.00,130.00 310.00,215.00 395.00,215.00" fill="none" stroke="#176879" stroke-width="3" /><polyline points="395.00,215.00 395.00,130.00 425.00,130.00 425.00,215.00 510.00,215.00" fill="none" stroke="#176879" stroke-width="3" /><polyline points="510.00,215.00 510.00,130.00 540.00,130.00 540.00,215.00 625.00,215.00" fill="none" stroke="#176879" stroke-width="3" /><text x="67" y="251" font-size="23" fill="#176879" text-anchor="middle" font-weight="normal">τ</text><line x1="50" y1="272" x2="165" y2="272" stroke="#172e41" stroke-width="2" /><text x="106" y="304" font-size="23" fill="#172e41" text-anchor="middle" font-weight="normal">T</text><text x="28" y="353" font-size="23" fill="#a94f18" text-anchor="start" font-weight="normal">理想冲激极限：宽 τ、高 1/τ，面积保持 1</text><line x1="65" y1="485" x2="65" y2="405" stroke="#172e41" stroke-width="2" marker-end="url(#arrow)"/><line x1="180" y1="485" x2="180" y2="405" stroke="#172e41" stroke-width="2" marker-end="url(#arrow)"/><line x1="295" y1="485" x2="295" y2="405" stroke="#172e41" stroke-width="2" marker-end="url(#arrow)"/><line x1="410" y1="485" x2="410" y2="405" stroke="#172e41" stroke-width="2" marker-end="url(#arrow)"/><line x1="525" y1="485" x2="525" y2="405" stroke="#172e41" stroke-width="2" marker-end="url(#arrow)"/><line x1="42" y1="485" x2="600" y2="485" stroke="#172e41" stroke-width="2" /><text x="30" y="535" font-size="22" fill="#172e41" text-anchor="start" font-weight="normal">只让宽度趋于 0、仍保持高 1，面积会趋于 0。</text><text x="30" y="580" font-size="22" fill="#172e41" text-anchor="start" font-weight="normal">自然采样：副本带权 Cₖ；整幅频谱一般不周期。</text></g></svg>