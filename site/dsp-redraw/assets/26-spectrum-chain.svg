<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-labelledby="title desc"><title id="title">采样、记录、加窗和FFT各管什么</title><desc id="desc">抗混叠滤波和足够采样率在ADC前后防止频率重叠。保留M个真实样本决定观测时长。加窗影响主瓣与旁瓣，补零至N仅使DFT频率格点更密。最后把编号k换成kfs/N赫兹。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#496172"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183545;font-size:24px} .small{font-size:20px;fill:#496172} .heading{font-size:31px;font-weight:700} .accent{fill:#087d8c} .warm{fill:#aa4b20} .math{font-family:"DejaVu Sans","Noto Sans CJK SC",sans-serif}</style><rect width="100%" height="100%" fill="#fcfdfb"/><text x="32" y="49" class="heading" text-anchor="start">实际频谱：先分清每一步改变什么</text><rect x="32" y="99" width="830" height="74" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="54" y="131" class="accent" text-anchor="start">① 抗混叠 + 采样</text><text x="54" y="160" class="small math" text-anchor="start">fₛ = 1/T；先限制进入采样器的带宽</text><line x1="830" y1="173" x2="830" y2="194" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="195" width="830" height="74" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="54" y="227" class="accent" text-anchor="start">② 记录 M 个真样本</text><text x="54" y="256" class="small math" text-anchor="start">有效窗长 T<tspan baseline-shift="sub" font-size="75%">obs</tspan> = M/fₛ</text><line x1="830" y1="269" x2="830" y2="290" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="291" width="830" height="74" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="54" y="323" class="accent" text-anchor="start">③ 加窗 w(n)</text><text x="54" y="352" class="small math" text-anchor="start">决定主瓣宽度与旁瓣泄漏</text><line x1="830" y1="365" x2="830" y2="386" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="387" width="830" height="74" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="54" y="419" class="accent" text-anchor="start">④ 补零到 N 点，再 FFT</text><text x="54" y="448" class="small math" text-anchor="start">格距 Δf = fₛ/N；频率 fₖ = kfₛ/N</text><text x="32" y="510" class="small math" text-anchor="start">连续傅里叶积分的近似带尺度 T：Xₐ(fₖ) ≈ T · X<tspan baseline-shift="sub" font-size="75%">N</tspan>(k)。</text></svg>