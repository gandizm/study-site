<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="t d"><title id="t">四抽头对称FIR将四次乘法化为两次</title><desc id="d">样值成对相加后共用相同系数，延迟存储仍保留三个单元。</desc><metadata>{&quot;length&quot;: 4, &quot;pairedIndices&quot;: [[0, 3], [1, 2]], &quot;directMultipliers&quot;: 4, &quot;foldedMultipliers&quot;: 2, &quot;delays&quot;: 3}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#16314a"/></marker></defs><rect width="960" height="700" fill="#fbfdff"/><g font-family="system-ui, Noto Sans CJK SC, sans-serif"><text x="40" y="42" font-size="30" fill="#16314a" text-anchor="start" font-weight="700">对称 FIR：先配对相加，再乘一次系数</text><text x="40" y="94" font-size="26" fill="#155eaa" text-anchor="start" font-weight="400">例：h = [a, b, b, a]，长度4，阶数3</text><circle cx="115" cy="170" r="4" fill="#16314a"/><text x="115" y="140" font-size="24" fill="#16314a" text-anchor="middle" font-weight="400">x(n)</text><line x1="120.00" y1="170.00" x2="180.00" y2="170.00" stroke="#16314a" stroke-width="2.5"/><polygon points="180,170 169.0,165.5 169.0,174.5" fill="#16314a"/><rect x="185" y="145" width="90" height="50" rx="8" fill="white" stroke="#155eaa" stroke-width="2.5"/><text x="230.0" y="179.0" font-size="25" fill="#155eaa" text-anchor="middle" font-weight="400">z⁻¹</text><line x1="280.00" y1="170.00" x2="335.00" y2="170.00" stroke="#16314a" stroke-width="2.5"/><polygon points="335,170 324.0,165.5 324.0,174.5" fill="#16314a"/><circle cx="340" cy="170" r="4" fill="#16314a"/><text x="340" y="140" font-size="24" fill="#16314a" text-anchor="middle" font-weight="400">x(n−1)</text><line x1="345.00" y1="170.00" x2="405.00" y2="170.00" stroke="#16314a" stroke-width="2.5"/><polygon points="405,170 394.0,165.5 394.0,174.5" fill="#16314a"/><rect x="410" y="145" width="90" height="50" rx="8" fill="white" stroke="#155eaa" stroke-width="2.5"/><text x="455.0" y="179.0" font-size="25" fill="#155eaa" text-anchor="middle" font-weight="400">z⁻¹</text><line x1="505.00" y1="170.00" x2="560.00" y2="170.00" stroke="#16314a" stroke-width="2.5"/><polygon points="560,170 549.0,165.5 549.0,174.5" fill="#16314a"/><circle cx="565" cy="170" r="4" fill="#16314a"/><text x="565" y="140" font-size="24" fill="#16314a" text-anchor="middle" font-weight="400">x(n−2)</text><line x1="570.00" y1="170.00" x2="630.00" y2="170.00" stroke="#16314a" stroke-width="2.5"/><polygon points="630,170 619.0,165.5 619.0,174.5" fill="#16314a"/><rect x="635" y="145" width="90" height="50" rx="8" fill="white" stroke="#155eaa" stroke-width="2.5"/><text x="680.0" y="179.0" font-size="25" fill="#155eaa" text-anchor="middle" font-weight="400">z⁻¹</text><line x1="730.00" y1="170.00" x2="785.00" y2="170.00" stroke="#16314a" stroke-width="2.5"/><polygon points="785,170 774.0,165.5 774.0,174.5" fill="#16314a"/><circle cx="790" cy="170" r="4" fill="#16314a"/><text x="790" y="140" font-size="24" fill="#16314a" text-anchor="middle" font-weight="400">x(n−3)</text><path d="M115 175 L115 300 L280 300" fill="none" stroke="#16314a" stroke-width="2.5"/><polygon points="280.0,300.0 269.0,295.5 269.0,304.5" fill="#16314a"/><path d="M790 175 L790 265 L305 265 L305 275" fill="none" stroke="#16314a" stroke-width="2.5"/><polygon points="305.0,275.0 309.5,264.0 300.5,264.0" fill="#16314a"/><circle cx="305" cy="300" r="23" fill="white" stroke="#16314a" stroke-width="2.5"/><text x="305" y="309" font-size="30" fill="#16314a" text-anchor="middle" font-weight="400">+</text><line x1="330.00" y1="300.00" x2="420.00" y2="300.00" stroke="#16314a" stroke-width="2.5"/><polygon points="420,300 409.0,295.5 409.0,304.5" fill="#16314a"/><rect x="425" y="270" width="100" height="60" rx="8" fill="white" stroke="#087f79" stroke-width="2.5"/><text x="475.0" y="309.0" font-size="25" fill="#087f79" text-anchor="middle" font-weight="400">× a</text><path d="M340 175 L340 360 L245 360 L245 450 L280 450" fill="none" stroke="#16314a" stroke-width="2.5"/><polygon points="280.0,450.0 269.0,445.5 269.0,454.5" fill="#16314a"/><path d="M565 175 L565 395 L305 395 L305 425" fill="none" stroke="#16314a" stroke-width="2.5"/><polygon points="305.0,425.0 309.5,414.0 300.5,414.0" fill="#16314a"/><circle cx="305" cy="450" r="23" fill="white" stroke="#16314a" stroke-width="2.5"/><text x="305" y="459" font-size="30" fill="#16314a" text-anchor="middle" font-weight="400">+</text><line x1="330.00" y1="450.00" x2="420.00" y2="450.00" stroke="#16314a" stroke-width="2.5"/><polygon points="420,450 409.0,445.5 409.0,454.5" fill="#16314a"/><rect x="425" y="420" width="100" height="60" rx="8" fill="white" stroke="#087f79" stroke-width="2.5"/><text x="475.0" y="459.0" font-size="25" fill="#087f79" text-anchor="middle" font-weight="400">× b</text><path d="M530 300 L700 300 L700 350" fill="none" stroke="#16314a" stroke-width="2.5"/><polygon points="700.0,350.0 704.5,339.0 695.5,339.0" fill="#16314a"/><path d="M530 450 L700 450 L700 400" fill="none" stroke="#16314a" stroke-width="2.5"/><polygon points="700.0,400.0 695.5,411.0 704.5,411.0" fill="#16314a"/><circle cx="700" cy="375" r="23" fill="white" stroke="#16314a" stroke-width="2.5"/><text x="700" y="384" font-size="30" fill="#16314a" text-anchor="middle" font-weight="400">+</text><line x1="725.00" y1="375.00" x2="855.00" y2="375.00" stroke="#16314a" stroke-width="2.5"/><polygon points="855,375 844.0,370.5 844.0,379.5" fill="#16314a"/><text x="875" y="385" font-size="26" fill="#16314a" text-anchor="start" font-weight="400">y(n)</text><text x="40" y="555" font-size="26" fill="#16314a" text-anchor="start" font-weight="400">y(n)=a[x(n)+x(n−3)] + b[x(n−1)+x(n−2)]</text><text x="40" y="610" font-size="24" fill="#577082" text-anchor="start" font-weight="400">反对称时改成相减；奇数长度的中心抽头单独保留。</text><text x="40" y="655" font-size="24" fill="#b45412" text-anchor="start" font-weight="400">奇数长度且反对称：中心系数必须为 0。</text></g></svg>