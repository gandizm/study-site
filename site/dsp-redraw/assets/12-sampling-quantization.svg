<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title"><title id="title">四个实数样本映到两位量化等级，明确采样与量化的区别</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536d83"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17344c;font-size:24px} .small{font-size:22px;fill:#536d83} .head{font-size:32px;font-weight:700} .label{font-size:26px;font-weight:600}</style><rect width="100%" height="100%" fill="#fff"/><text x="35" y="55" class="head" text-anchor="start">离散时间 ≠ 已经量化</text><text x="45" y="105" class="label" text-anchor="start">采样：只在指定时刻取值</text><text x="565" y="105" class="label" text-anchor="start">量化：把样值映到有限等级</text><path d="M70 400L470 400" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><path d="M585 400L985 400" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><path d="M100 400V372.0" stroke="#1766b4" stroke-width="4"/><circle cx="100" cy="372.0" r="7" fill="#1766b4"/><text x="100" y="356.0" class="" text-anchor="middle">0.10</text><text x="100" y="435" class="small" text-anchor="middle">0</text><path d="M205 400V299.2" stroke="#1766b4" stroke-width="4"/><circle cx="205" cy="299.2" r="7" fill="#1766b4"/><text x="205" y="283.2" class="" text-anchor="middle">0.36</text><text x="205" y="435" class="small" text-anchor="middle">1</text><path d="M310 400V226.4" stroke="#1766b4" stroke-width="4"/><circle cx="310" cy="226.4" r="7" fill="#1766b4"/><text x="310" y="210.4" class="" text-anchor="middle">0.62</text><text x="310" y="435" class="small" text-anchor="middle">2</text><path d="M415 400V204.0" stroke="#1766b4" stroke-width="4"/><circle cx="415" cy="204.0" r="7" fill="#1766b4"/><text x="415" y="188.0" class="" text-anchor="middle">0.70</text><text x="415" y="435" class="small" text-anchor="middle">3</text><path d="M580 400H1040" stroke="#d0dee7" stroke-dasharray="5 6"/><text x="575" y="407" class="small" text-anchor="end">0</text><path d="M580 330.0H1040" stroke="#d0dee7" stroke-dasharray="5 6"/><text x="575" y="337.0" class="small" text-anchor="end">0.25</text><path d="M580 260.0H1040" stroke="#d0dee7" stroke-dasharray="5 6"/><text x="575" y="267.0" class="small" text-anchor="end">0.5</text><path d="M580 190.0H1040" stroke="#d0dee7" stroke-dasharray="5 6"/><text x="575" y="197.0" class="small" text-anchor="end">0.75</text><path d="M620 400V400" stroke="#087f82" stroke-width="4"/><circle cx="620" cy="400" r="7" fill="#087f82"/><text x="620" y="384" class="" text-anchor="middle">0.00</text><text x="620" y="435" class="small" text-anchor="middle">00</text><path d="M725 400V330.0" stroke="#087f82" stroke-width="4"/><circle cx="725" cy="330.0" r="7" fill="#087f82"/><text x="725" y="314.0" class="" text-anchor="middle">0.25</text><text x="725" y="435" class="small" text-anchor="middle">01</text><path d="M830 400V260.0" stroke="#087f82" stroke-width="4"/><circle cx="830" cy="260.0" r="7" fill="#087f82"/><text x="830" y="244.0" class="" text-anchor="middle">0.50</text><text x="830" y="435" class="small" text-anchor="middle">10</text><path d="M935 400V190.0" stroke="#087f82" stroke-width="4"/><circle cx="935" cy="190.0" r="7" fill="#087f82"/><text x="935" y="174.0" class="" text-anchor="middle">0.75</text><text x="935" y="435" class="small" text-anchor="middle">11</text><text x="270" y="485" class="small" text-anchor="middle">n = 0, 1, 2, 3；T = 1 ms</text><text x="820" y="485" class="small" text-anchor="middle">2 bit：4个码字对应4个等级</text><text x="550" y="550" class="" text-anchor="middle" style="fill:#b85109">新编教学数据；最近等级量化，不代表原PPT实验测量</text></svg>