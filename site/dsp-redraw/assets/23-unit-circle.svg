<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">DFT取样位置与旋转因子的正负号</title><desc id="desc">八个Z平面取样点逆时针排列；正变换内部z的负幂给负指数。</desc><metadata>{&quot;N&quot;: 8, &quot;angles&quot;: [0.0, 0.7853981633974483, 1.5707963267948966, 2.356194490192345, 3.141592653589793, 3.9269908169872414, 4.71238898038469, 5.497787143782138]}</metadata><rect width="960" height="470" fill="#fbfdff"/><g font-family="system-ui, Noto Sans CJK SC, sans-serif"><line x1="60.00" y1="245.00" x2="430.00" y2="245.00" stroke="#d9e4eb" stroke-width="2"/><line x1="240.00" y1="65.00" x2="240.00" y2="425.00" stroke="#d9e4eb" stroke-width="2"/><circle cx="240" cy="245" r="150" fill="none" stroke="#d9e4eb" stroke-width="3"/><circle cx="390.00" cy="245.00" r="7" fill="#155eaa"/><text x="425.0" y="253.0" font-size="24" fill="#155eaa" text-anchor="middle" font-weight="400">0</text><circle cx="346.07" cy="138.93" r="7" fill="#155eaa"/><text x="370.8147545195113" y="122.18524548048873" font-size="24" fill="#155eaa" text-anchor="middle" font-weight="400">1</text><circle cx="240.00" cy="95.00" r="7" fill="#155eaa"/><text x="240.0" y="68.0" font-size="24" fill="#155eaa" text-anchor="middle" font-weight="400">2</text><circle cx="133.93" cy="138.93" r="7" fill="#155eaa"/><text x="109.18524548048873" y="122.1852454804887" font-size="24" fill="#155eaa" text-anchor="middle" font-weight="400">3</text><circle cx="90.00" cy="245.00" r="7" fill="#155eaa"/><text x="55.0" y="252.99999999999997" font-size="24" fill="#155eaa" text-anchor="middle" font-weight="400">4</text><circle cx="133.93" cy="351.07" r="7" fill="#155eaa"/><text x="109.18524548048867" y="383.81475451951127" font-size="24" fill="#155eaa" text-anchor="middle" font-weight="400">5</text><circle cx="240.00" cy="395.00" r="7" fill="#155eaa"/><text x="239.99999999999997" y="438.0" font-size="24" fill="#155eaa" text-anchor="middle" font-weight="400">6</text><circle cx="346.07" cy="351.07" r="7" fill="#155eaa"/><text x="370.81475451951127" y="383.8147545195113" font-size="24" fill="#155eaa" text-anchor="middle" font-weight="400">7</text><text x="520" y="100" font-size="30" fill="#16314a" text-anchor="start" font-weight="700">同一组 N 个频率位置</text><text x="520" y="158" font-size="30" fill="#155eaa" text-anchor="start" font-weight="400">ωₖ = 2πk / N</text><text x="520" y="213" font-size="28" fill="#155eaa" text-anchor="start" font-weight="400">zₖ = exp(+j2πk / N)</text><text x="520" y="278" font-size="26" fill="#16314a" text-anchor="start" font-weight="400">zₖ⁻ⁿ = exp(−j2πkn / N)</text><text x="520" y="338" font-size="26" fill="#087f79" text-anchor="start" font-weight="400">W_N = exp(−j2π / N)</text><text x="520" y="394" font-size="22" fill="#577082" text-anchor="start" font-weight="400">例：N = 8；从 k = 0 逆时针走</text></g></svg>