<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title"><title id="title">DSP是处理方法，也可指处理器；两者不是同一个概念</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536d83"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17344c;font-size:24px} .small{font-size:20px;fill:#536d83} .head{font-size:32px;font-weight:700} .label{font-size:26px;font-weight:600}</style><rect width="100%" height="100%" fill="#fff"/><text x="40" y="55" class="head" text-anchor="start">同一个缩写，两个层次</text><rect x="45" y="105" width="420" height="150" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="255.0" y="171.0" class="label" text-anchor="middle">Digital Signal Processing</text><text x="255.0" y="205.0" class="small" text-anchor="middle">数学模型 · 方法 · 算法</text><rect x="535" y="105" width="420" height="150" rx="14" fill="#eaf6f3" stroke="#bfceda"/><text x="745.0" y="171.0" class="label" text-anchor="middle">Digital Signal Processor</text><text x="745.0" y="205.0" class="small" text-anchor="middle">执行算法的一类芯片</text><path d="M465 180L530 180" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="300" class="" text-anchor="middle">算法也可由通用计算机、FPGA等实现</text><text x="500" y="350" class="" text-anchor="middle" style="fill:#b85109">会按按钮运行软件 ≠ 解释算法为何有效</text><text x="500" y="405" class="small" text-anchor="middle">先把数学对象、输入、输出和条件说清楚</text></svg>