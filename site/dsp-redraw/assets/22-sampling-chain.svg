<svg xmlns="http://www.w3.org/2000/svg" width="640" height="705" viewBox="0 0 640 705" role="img" aria-labelledby="title desc"><title id="title">22-sampling-chain</title><desc id="desc">连续信号到冲激采样信号，再到样值序列的对象辨析，说明频率变量的单位与换轴关系。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17253b"/></marker></defs><rect width="640" height="705" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="43" font-size="29" fill="#17253b" text-anchor="start" font-weight="700">采样后，是两个不同对象</text><rect x="35" y="80" width="570" height="100" rx="12" fill="#f0f6fc" stroke="#d8e2ed"/><text x="320" y="119" font-size="29" fill="#17253b" text-anchor="middle" font-weight="400">连续时间信号 xₐ(t)</text><text x="320" y="157" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">频谱 Xₐ(jΩ) · Ω单位rad/s</text><line x1="320.00" y1="192.00" x2="320.00" y2="232.00" stroke="#17253b" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="223" font-size="24" fill="#52637b" text-anchor="start" font-weight="400">每T秒取样</text><rect x="35" y="250" width="570" height="120" rx="12" fill="#eef8f6" stroke="#d8e2ed"/><text x="320" y="290" font-size="28" fill="#087c76" text-anchor="middle" font-weight="400">冲激采样信号 x̂ₐ(t)</text><text x="320" y="331" font-size="25" fill="#17253b" text-anchor="middle" font-weight="400">连续时间上的带权冲激串</text><line x1="320.00" y1="382.00" x2="320.00" y2="427.00" stroke="#17253b" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="414" font-size="23" fill="#52637b" text-anchor="start" font-weight="400">只保留样值编号</text><rect x="35" y="445" width="570" height="120" rx="12" fill="#f0f6fc" stroke="#d8e2ed"/><text x="320" y="486" font-size="28" fill="#1768be" text-anchor="middle" font-weight="400">样值序列 x(n) = xₐ(nT)</text><text x="320" y="528" font-size="24" fill="#17253b" text-anchor="middle" font-weight="400">离散时间；频率ω为rad/sample</text><text x="320" y="625" font-size="30" fill="#17253b" text-anchor="middle" font-weight="700">ω = ΩT；T = 1/fₛ</text><text x="320" y="674" font-size="24" fill="#c34440" text-anchor="middle" font-weight="400">换频率轴时，冲激权重也要换尺度</text></g></svg>