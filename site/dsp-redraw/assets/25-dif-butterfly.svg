<svg xmlns="http://www.w3.org/2000/svg" width="900" height="445" viewBox="0 0 900 445" role="img" aria-labelledby="title desc"><title id="title">DIF蝶形：先和差，后乘旋转因子</title><desc id="desc">输入A为x(n)，B为x(n+N/2)。上路和A+B得到x1，做N/2点DFT得到偶频率X(2r)。下路差A-B乘W_N的n次方得到x2，做N/2点DFT得到奇频率X(2r+1)。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#496172"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183545;font-size:24px} .small{font-size:20px;fill:#496172} .heading{font-size:31px;font-weight:700} .accent{fill:#087d8c} .warm{fill:#aa4b20} .math{font-family:"DejaVu Sans","Noto Sans CJK SC",sans-serif}</style><rect width="100%" height="100%" fill="#fcfdfb"/><text x="32" y="49" class="heading" text-anchor="start">DIF：先和差，差支路再旋转</text><text x="32" y="86" class="small" text-anchor="start">0 ≤ n &lt; N/2；r 是短 DFT 的频率编号</text><text x="34" y="161" class="math" text-anchor="start">A = x(n)</text><text x="34" y="293" class="math" text-anchor="start">B = x(n+N/2)</text><circle cx="237" cy="154" r="6" fill="#087d8c"/><circle cx="237" cy="286" r="6" fill="#087d8c"/><line x1="240" y1="154" x2="395" y2="154" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><line x1="240" y1="286" x2="395" y2="154" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><line x1="240" y1="154" x2="395" y2="286" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><line x1="240" y1="286" x2="395" y2="286" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><circle cx="422" cy="154" r="25" fill="white" stroke="#496172" stroke-width="2"/><text x="422" y="162" class="math" text-anchor="middle">+</text><circle cx="422" cy="286" r="25" fill="white" stroke="#496172" stroke-width="2"/><text x="422" y="294" class="math" text-anchor="middle">−</text><line x1="448" y1="154" x2="535" y2="154" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><text x="550" y="161" class="math" text-anchor="start">x₁(n) = A + B</text><line x1="448" y1="286" x2="500" y2="286" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="505" y="253" width="124" height="66" rx="12" fill="#fff0e5" stroke="#d3ab89"/><text x="567" y="296" class="math" text-anchor="middle">× W<tspan baseline-shift="sub" font-size="75%">N</tspan>ⁿ</text><line x1="629" y1="286" x2="674" y2="286" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><text x="692" y="293" class="math" text-anchor="start">x₂(n)</text><text x="550" y="201" class="small math" text-anchor="start">N/2 点DFT → X(2r)</text><text x="550" y="335" class="small math" text-anchor="start">N/2 点DFT → X(2r+1)</text><text x="32" y="405" class="small" text-anchor="start">标准原位流程：自然序输入 → DIF → 位反转输出；最后按编号重排。</text></svg>