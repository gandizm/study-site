<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="title desc"><title id="title">CTFT、DTFT、DFS、DFT和FFT的对象图</title><desc id="desc">连续时间信号对应CTFT；离散时间序列对应连续且2π周期的DTFT；周期离散序列对应每周期N个DFS系数；有限N点数组对应N点DFT。DFT是有限数组的变换，FFT是它的快速算法。图中概念连线不主张无需条件即可互换。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#496172"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183545;font-size:24px} .small{font-size:20px;fill:#496172} .heading{font-size:31px;font-weight:700} .accent{fill:#087d8c} .warm{fill:#aa4b20} .math{font-family:"DejaVu Sans","Noto Sans CJK SC",sans-serif}</style><rect width="100%" height="100%" fill="#fcfdfb"/><text x="32" y="49" class="heading" text-anchor="start">先辨认对象，再选择变换</text><rect x="30" y="99" width="285" height="70" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="172" y="143" class="" text-anchor="middle">连续时间 xₐ(t)</text><line x1="315" y1="134" x2="375" y2="134" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><text x="447" y="142" class="math" text-anchor="middle">CTFT</text><line x1="524" y1="134" x2="580" y2="134" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="580" y="99" width="290" height="70" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="725" y="143" class="" text-anchor="middle">连续频率 f</text><rect x="30" y="199" width="285" height="70" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="172" y="243" class="" text-anchor="middle">一般离散序列 x(n)</text><line x1="315" y1="234" x2="375" y2="234" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><text x="447" y="242" class="math" text-anchor="middle">DTFT</text><line x1="524" y1="234" x2="580" y2="234" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="580" y="199" width="290" height="70" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="725" y="243" class="" text-anchor="middle">连续 ω，2π 周期</text><rect x="30" y="299" width="285" height="70" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="172" y="343" class="" text-anchor="middle">N 周期离散序列</text><line x1="315" y1="334" x2="375" y2="334" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><text x="447" y="342" class="math" text-anchor="middle">DFS</text><line x1="524" y1="334" x2="580" y2="334" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="580" y="299" width="290" height="70" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="725" y="343" class="" text-anchor="middle">N 个系数（周期重复）</text><rect x="30" y="399" width="285" height="70" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="172" y="443" class="" text-anchor="middle">有限 N 点数组</text><line x1="315" y1="434" x2="375" y2="434" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><text x="447" y="442" class="math" text-anchor="middle">DFT</text><line x1="524" y1="434" x2="580" y2="434" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="580" y="399" width="290" height="70" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="725" y="443" class="" text-anchor="middle">N 个频率格点</text><text x="32" y="548" class="small" text-anchor="start">FFT 只加速 DFT 的计算；它没有新增一种时频对象或归一化约定。</text></svg>