<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-labelledby="title"><title id="title">五个相关概念的输入输出与归一化条件，补充连续时间傅里叶级数</title><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17344c;font-size:24px}.title{font-size:34px;font-weight:700}.small{font-size:24px;fill:#536d83}</style><rect width="1180" height="680" fill="white"/><text x="35" y="55" class="title">先识别对象，再选择傅里叶表示</text><rect x="30" y="95" width="1120" height="88" rx="12" fill="#edf5fb"/><text x="48" y="127">CTFT</text><text x="230" y="127">连续时间 xₐ(t)</text><text x="555" y="127">连续 Ω（rad/s）</text><text x="230" y="161" class="small">普通函数需先检查存在条件</text><rect x="30" y="195" width="1120" height="88" rx="12" fill="#edf7f3"/><text x="48" y="227">连续时间 FS</text><text x="230" y="227">T₀ 周期的 xₐ(t)</text><text x="555" y="227">谐波系数 aₖ；Ωₖ=kΩ₀</text><text x="230" y="261" class="small">Ω₀=2π/T₀；系数≠冲激权重</text><rect x="30" y="295" width="1120" height="88" rx="12" fill="#edf5fb"/><text x="48" y="327">DTFT</text><text x="230" y="327">整数索引 x[n]</text><text x="555" y="327">连续 ω；2π 周期</text><text x="230" y="361" class="small">ω 单位 rad/sample</text><rect x="30" y="395" width="1120" height="88" rx="12" fill="#edf7f3"/><text x="48" y="427">DFS</text><text x="230" y="427">N 周期的离散序列</text><text x="555" y="427">N 个独立系数，按 N 重复</text><text x="230" y="461" class="small">本课正向不除 N，逆向除 N</text><rect x="30" y="495" width="1120" height="88" rx="12" fill="#edf5fb"/><text x="48" y="527">DFT</text><text x="230" y="527">有限 N 点数组</text><text x="555" y="527">N 个复数值 X[k]</text><text x="230" y="561" class="small">周期延拓是解释，不强加给原信号</text><text x="590" y="635" text-anchor="middle" class="small">原补充P2–7为四种形式；这里额外列出DFS，避免把它和连续时间FS混写。</text></svg>