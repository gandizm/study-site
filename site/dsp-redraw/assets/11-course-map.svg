<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title"><title id="title">课程三章：信号表示、傅里叶分析、数字滤波</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536d83"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17344c;font-size:24px} .small{font-size:20px;fill:#536d83} .head{font-size:32px;font-weight:700} .label{font-size:26px;font-weight:600}</style><rect width="100%" height="100%" fill="#fff"/><text x="40" y="55" class="head" text-anchor="start">全课只先记住这三个问题</text><rect x="90" y="100" width="820" height="105" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="500.0" y="143.5" class="label" text-anchor="middle">第1章：怎样把信号变成可计算的数？</text><text x="500.0" y="177.5" class="small" text-anchor="middle">采样、量化、序列、系统</text><path d="M500 207L500 245" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="90" y="250" width="820" height="105" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="500.0" y="293.5" class="label" text-anchor="middle">第2章：这些数包含哪些频率？</text><text x="500.0" y="327.5" class="small" text-anchor="middle">DTFT → DFS → DFT → 频域采样 → FFT → 应用</text><path d="M500 357L500 395" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="90" y="400" width="820" height="105" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="500.0" y="443.5" class="label" text-anchor="middle">第3章：怎样按要求改变信号？</text><text x="500.0" y="477.5" class="small" text-anchor="middle">滤波器结构 · IIR设计 · FIR设计</text><text x="500" y="560" class="small" text-anchor="middle">本次先攻第2章；回补前置概念，不先背完整行业案例</text></svg>