<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720" role="img" aria-labelledby="title"><title id="title">理想采样的频谱副本和混叠</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#172e41"/></marker></defs><rect width="640" height="720" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="24" y="32" font-size="24" fill="#172e41" text-anchor="start" font-weight="bold">Ωₛ&gt;2Ωₕ：副本互不重叠</text><line x1="45" y1="175" x2="600" y2="175" stroke="#172e41" stroke-width="2" marker-end="url(#arrow)"/><text x="602" y="183" font-size="23" fill="#172e41" text-anchor="start" font-weight="normal">Ω</text><polyline points="99.50,175.00 158.00,75.00 216.50,175.00" fill="none" stroke="#a94f18" stroke-width="3" /><text x="158.0" y="208" font-size="21" fill="#566b7a" text-anchor="middle" font-weight="normal">−Ωₛ</text><polyline points="261.50,175.00 320.00,75.00 378.50,175.00" fill="none" stroke="#176879" stroke-width="3" /><text x="320.0" y="208" font-size="21" fill="#566b7a" text-anchor="middle" font-weight="normal">0</text><polyline points="423.50,175.00 482.00,75.00 540.50,175.00" fill="none" stroke="#a94f18" stroke-width="3" /><text x="482.0" y="208" font-size="21" fill="#566b7a" text-anchor="middle" font-weight="normal">Ωₛ</text><text x="320" y="65" font-size="21" fill="#176879" text-anchor="middle" font-weight="normal">峰值按 1/T 缩放</text><text x="24" y="272" font-size="24" fill="#172e41" text-anchor="start" font-weight="bold">Ωₛ&lt;2Ωₕ：相邻副本重叠，产生混叠</text><line x1="45" y1="415" x2="600" y2="415" stroke="#172e41" stroke-width="2" marker-end="url(#arrow)"/><text x="602" y="423" font-size="23" fill="#172e41" text-anchor="start" font-weight="normal">Ω</text><polyline points="54.50,415.00 158.00,315.00 261.50,415.00" fill="none" stroke="#a94f18" stroke-width="3" /><text x="158.0" y="448" font-size="21" fill="#566b7a" text-anchor="middle" font-weight="normal">−Ωₛ</text><polyline points="216.50,415.00 320.00,315.00 423.50,415.00" fill="none" stroke="#176879" stroke-width="3" /><text x="320.0" y="448" font-size="21" fill="#566b7a" text-anchor="middle" font-weight="normal">0</text><polyline points="378.50,415.00 482.00,315.00 585.50,415.00" fill="none" stroke="#a94f18" stroke-width="3" /><text x="482.0" y="448" font-size="21" fill="#566b7a" text-anchor="middle" font-weight="normal">Ωₛ</text><text x="320" y="305" font-size="21" fill="#176879" text-anchor="middle" font-weight="normal">峰值按 1/T 缩放</text><text x="26" y="539" font-size="26" fill="#172e41" text-anchor="start" font-weight="bold">恢复：只取中央副本，再乘 T</text><rect x="32" y="573" width="170" height="70" rx="10" fill="#eaf5f6" stroke="#176879" stroke-width="2"/><text x="117.0" y="616.0" font-size="24" fill="#176879" text-anchor="middle" font-weight="normal">采样谱 X̂ₐ</text><line x1="210" y1="608" x2="252" y2="608" stroke="#172e41" stroke-width="2" marker-end="url(#arrow)"/><rect x="262" y="573" width="190" height="70" rx="10" fill="#eaf5f6" stroke="#176879" stroke-width="2"/><text x="357.0" y="616.0" font-size="24" fill="#176879" text-anchor="middle" font-weight="normal">理想低通：T</text><line x1="460" y1="608" x2="496" y2="608" stroke="#172e41" stroke-width="2" marker-end="url(#arrow)"/><rect x="506" y="573" width="100" height="70" rx="10" fill="#eaf5f6" stroke="#176879" stroke-width="2"/><text x="556.0" y="616.0" font-size="24" fill="#176879" text-anchor="middle" font-weight="normal">Xₐ</text><text x="34" y="689" font-size="22" fill="#172e41" text-anchor="start" font-weight="normal">截止范围取 |Ω|&lt;Ωₛ/2；前提是没有混叠。</text></g></svg>