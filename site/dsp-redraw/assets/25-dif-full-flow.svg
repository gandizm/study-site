<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc"><title id="title">八点DIF三级流图与位反转输出</title><desc id="desc">自然序x0到x7输入。三级蝶距依次4,2,1。每对输入u,v，上节点输出u+v，下节点输出(u-v)乘W8的p次方，p标在下节点下方。最后槽位对应频率0,4,2,6,1,5,3,7。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#496172"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183545;font-size:24px} .small{font-size:20px;fill:#496172} .heading{font-size:31px;font-weight:700} .accent{fill:#087d8c} .warm{fill:#aa4b20} .math{font-family:"DejaVu Sans","Noto Sans CJK SC",sans-serif}</style><rect width="100%" height="100%" fill="#fcfdfb"/><text x="32" y="49" class="heading" text-anchor="start">八点 DIF：自然序输入，位反转输出</text><text x="32" y="86" class="small math" text-anchor="start">每对 u、v：上输出 u+v；下输出 (u−v)W₈ᵖ，p 标在下节点下方</text><text x="155" y="124" class="small" text-anchor="middle">输入</text><text x="395" y="124" class="small" text-anchor="middle">第1级 · 蝶距4</text><text x="635" y="124" class="small" text-anchor="middle">第2级 · 蝶距2</text><text x="875" y="124" class="small" text-anchor="middle">第3级 · 蝶距1</text><text x="35" y="167" class="math" text-anchor="start">x(0)</text><line x1="105" y1="160" x2="155" y2="160" stroke="#496172" stroke-width="2"/><text x="35" y="229" class="math" text-anchor="start">x(1)</text><line x1="105" y1="222" x2="155" y2="222" stroke="#496172" stroke-width="2"/><text x="35" y="291" class="math" text-anchor="start">x(2)</text><line x1="105" y1="284" x2="155" y2="284" stroke="#496172" stroke-width="2"/><text x="35" y="353" class="math" text-anchor="start">x(3)</text><line x1="105" y1="346" x2="155" y2="346" stroke="#496172" stroke-width="2"/><text x="35" y="415" class="math" text-anchor="start">x(4)</text><line x1="105" y1="408" x2="155" y2="408" stroke="#496172" stroke-width="2"/><text x="35" y