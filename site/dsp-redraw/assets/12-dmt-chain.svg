<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title"><title id="title">ADSL DMT的核心发送接收路径，发送IFFT接收FFT</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536d83"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17344c;font-size:24px} .small{font-size:22px;fill:#536d83} .head{font-size:32px;font-weight:700} .label{font-size:26px;font-weight:600}</style><rect width="100%" height="100%" fill="#fff"/><text x="35" y="55" class="head" text-anchor="start">DMT：把多路子载波合成一条时间波形</text><rect x="35" y="110" width="190" height="100" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="130.0" y="151.0" class="label" text-anchor="middle">比特 / 映射</text><text x="130.0" y="185.0" class="small" text-anchor="middle">子载波系数</text><path d="M228 160L267 160" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="270" y="110" width="145" height="100" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="342.5" y="168.0" class="label" text-anchor="middle">IFFT</text><path d="M418 160L457 160" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="460" y="110" width="195" height="100" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="557.5" y="168.0" class="label" text-anchor="middle">前缀 + 串行化</text><path d="M658 160L697 160" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="700" y="110" width="190" height="100" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="795.0" y="168.0" class="label" text-anchor="middle">D/A + 发送滤波</text><path d="M893 160L950 160" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><text x="990" y="170" class="" text-anchor="middle">信道</text><path d="M990 190L990 340" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="820" y="350" width="230" height="100" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="935.0" y="391.0" class="label" text-anchor="middle">接收滤波 + A/D</text><text x="935.0" y="425.0" class="small" text-anchor="middle">时域均衡</text><path d="M817 400L772 400" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="350" width="190" height="100" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="675.0" y="408.0" class="label" text-anchor="middle">去前缀 / 分块</text><path d="M577 400L532 400" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="385" y="350" width="145" height="100" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="457.5" y="408.0" class="label" text-anchor="middle">FFT</text><path d="M382 400L337 400" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="350" width="300" height="100" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="185.0" y="391.0" class="label" text-anchor="middle">频域均衡 / 判决 / 解码</text><text x="185.0" y="425.0" class="small" text-anchor="middle">恢复比特</text><text x="550" y="515" class="small" text-anchor="middle">图保留原P26主线；混合线圈、回波抵消及辅助控制从略。</text><text x="550" y="565" class="" text-anchor="middle" style="fill:#b85109">FFT只完成分析；同步、边界、信道和判决仍是独立环节。</text></svg>