<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title"><title id="title">滤波变换压缩估计识别各自的输入输出与任务</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536d83"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17344c;font-size:24px} .small{font-size:20px;fill:#536d83} .head{font-size:32px;font-weight:700} .label{font-size:26px;font-weight:600}</style><rect width="100%" height="100%" fill="#fff"/><text x="40" y="55" class="head" text-anchor="start">先问要什么输出，再选方法</text><rect x="45" y="100" width="270" height="75" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="180.0" y="145.5" class="label" text-anchor="middle">滤波</text><text x="355" y="145" class="" text-anchor="start">改变成分：噪声抑制、频段选择</text><rect x="45" y="195" width="270" height="75" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="180.0" y="240.5" class="label" text-anchor="middle">变换</text><text x="355" y="240" class="" text-anchor="start">改变表示：时间样值 → 频率系数</text><rect x="45" y="290" width="270" height="75" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="180.0" y="335.5" class="label" text-anchor="middle">压缩</text><text x="355" y="335" class="" text-anchor="start">降低存储 / 传输数据量</text><rect x="45" y="385" width="270" height="75" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="180.0" y="430.5" class="label" text-anchor="middle">估计</text><text x="355" y="430" class="" text-anchor="start">求未知量：频率、延迟、参数</text><rect x="45" y="480" width="270" height="75" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="180.0" y="525.5" class="label" text-anchor="middle">识别</text><text x="355" y="525" class="" text-anchor="start">由特征作分类或匹配</text><text x="500" y="595" class="small" text-anchor="middle">一次FFT可能是其中一步；不等于全部任务自动完成。</text></svg>