<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="title desc"><title id="title">冲激不变法的指数映射与混叠</title><desc id="desc">s平面左半平面极点经z=exp(sT)映射到单位圆内。实部决定半径exp(σT)，虚部决定角度ΩT，但相差2π/T的模拟频率映到同一数字角频率，故会混叠。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#496172"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183545;font-size:24px} .small{font-size:20px;fill:#496172} .heading{font-size:31px;font-weight:700} .accent{fill:#087d8c} .warm{fill:#aa4b20} .math{font-family:"DejaVu Sans","Noto Sans CJK SC",sans-serif}</style><rect width="100%" height="100%" fill="#fcfdfb"/><text x="32" y="49" class="heading" text-anchor="start">冲激不变：稳定性保留，但频率会绕回</text><text x="32" y="88" class="small math" text-anchor="start">z = exp(sT)，s=σ+jΩ；半径 r=exp(σT)，角度 ω=ΩT（模2π）</text><rect x="55" y="137" width="240" height="314" rx="0" fill="#edf6f2" stroke="#edf6f2"/><line x1="70" y1="390" x2="400" y2="390" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><line x1="295" y1="455" x2="295" y2="122" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><text x="305" y="150" class="small" text-anchor="start">jΩ</text><text x="370" y="424" class="small" text-anchor="start">σ</text><circle cx="181" cy="325" r="7" fill="#087d8c"/><text x="65" y="300" class="small math" text-anchor="start">−a + jΩ</text><circle cx="181" cy="203" r="7" fill="#087d8c"/><text x="65" y="178" class="small math" text-anchor="start">−a + j(Ω+2π/T)</text><text x="48" y="477" class="small" text-anchor="start">Re(s)&lt;0</text><line x1="412" y1="300" x2="502" y2="300" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><text x="426" y="269" class="small math" text-anchor="start">exp(sT)</text><circle cx="680" cy="300" r="145" fill="none" stroke="#adc5c2" stroke-width="2"/><line x1="515" y1="300" x2="850" y2="300" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><line x1="680" y1="460" x2="680" y2="135" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><line x1="680" y1="300" x2="724.95" y2="222.14431619977898" stroke="#087d8c" stroke-width="2"/><circle cx="724.95" cy="222.14431619977898" r="8" fill="#087d8c"/><text x="720" y="195" class="small" text-anchor="start">同一个 z</text><text x="786" y="337" class="small" text-anchor="start">|z|=1</text><text x="590" y="477" class="small" text-anchor="start">稳定极点在单位圆内</text><text x="32" y="541" class="small" text-anchor="start">它保留 h(n)=hₐ(nT) 的采样值；不保证每个模拟频率的响应都无失真保留。</text></svg>