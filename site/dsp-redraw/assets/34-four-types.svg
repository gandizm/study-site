<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc"><title id="title">四型实系数线性相位FIR对照</title><desc id="desc">I型偶对称奇长度，无强制端点零。II型偶对称偶长度，π处必为零。III型奇对称奇长度，0和π处均为零。IV型奇对称偶长度，0处必为零但π不必为零。下图脉冲响应仅用于显示对称关系，不是同一设计指标。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#496172"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183545;font-size:24px} .small{font-size:20px;fill:#496172} .heading{font-size:31px;font-weight:700} .accent{fill:#087d8c} .warm{fill:#aa4b20} .math{font-family:"DejaVu Sans","Noto Sans CJK SC",sans-serif}</style><rect width="100%" height="100%" fill="#fcfdfb"/><text x="32" y="48" class="heading" text-anchor="start">先看奇偶与对称，再决定能否实现目标频段</text><rect x="25" y="70" width="910" height="141" rx="12" fill="#f2f7f4" stroke="#dce8e3"/><text x="44" y="107" class="accent" text-anchor="start">I 型</text><text x="44" y="149" class="small" text-anchor="start">偶对称 / N 奇数</text><line x1="282" y1="134.5" x2="536" y2="134.5" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><line x1="290.0" y1="134.5" x2="290.0" y2="124.8409090909091" stroke="#087d8c" stroke-width="2"/><circle cx="290.0" cy="124.8409090909091" r="4" fill="#087d8c"/><line x1="347.5" y1="134.5" x2="347.5" y2="111.31818181818181" stroke="#087d8c" stroke-width="2"/><circle cx="347.5" cy="111.31818181818181" r="4" fill="#087d8c"/><line x1="405.0" y1="134.5" x2="405.0" y2="95.86363636363637" stroke="#087d8c" stroke-width="2"/><circle cx="405.0" cy="95.86363636363637" r="4" fill="#087d8c"/><line x1="462.5" y1="134.5" x2="462.5" y2="111.31818181818181" stroke="#087d8c" stroke-width="2"/><circle cx="462.5" cy="111.31818181818181" r="4" fill="#087d8c"/><line x1="520.0" y1="134.5" x2="520.0" y2="124.8409090909091" stroke="#087d8c" stroke-width="2"/><circle cx="520.0" cy="124.8409090909091" r="4" fill="#087d8c"/><line x1="405" y1="87" x2="405" y2="185" stroke="#adc5c2" stroke-width="1" stroke-dasharray="7 6"/><text x="565" y="109" class="small math" text-anchor="start">没有强制的 0 / π 零点</text><text x="565" y="157" class="small" text-anchor="start">可做低通、高通、带通、带阻</text><rect x="25" y="223" width="910" height="141" rx="12" fill="#f2f7f4" stroke="#dce8e3"/><text x="44" y="260" class="accent" text-anchor="start">II 型</text><text x="44" y="302" class="small" text-anchor="start">偶对称 / N 偶数</text><line x1="282" y1="287.5" x2="536" y2="287.5" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><line x1="290.0" y1="287.5" x2="290.0" y2="279.77272727272725" stroke="#087d8c" stroke-width="2"/><circle cx="290.0" cy="279.77272727272725" r="4" fill="#087d8c"/><line x1="336.0" y1="287.5" x2="336.0" y2="266.25" stroke="#087d8c" stroke-width="2"/><circle cx="336.0" cy="266.25" r="4" fill="#087d8c"/><line x1="382.0" y1="287.5" x2="382.0" y2="248.86363636363637" stroke="#087d8c" stroke-width="2"/><circle cx="382.0" cy="248.86363636363637" r="4" fill="#087d8c"/><line x1="428.0" y1="287.5" x2="428.0" y2="248.86363636363637" stroke="#087d8c" stroke-width="2"/><circle cx="428.0" cy="248.86363636363637" r="4" fill="#087d8c"/><line x1="474.0" y1="287.5" x2="474.0" y2="266.25" stroke="#087d8c" stroke-width="2"/><circle cx="474.0" cy="266.25" r="4" fill="#087d8c"/><line x1="520.0" y1="287.5" x2="520.0" y2="279.77272727272725" stroke="#087d8c" stroke-width="2"/><circle cx="520.0" cy="279.77272727272725" r="4" fill="#087d8c"/><line x1="405" y1="240" x2="405" y2="338" stroke="#adc5c2" stroke-width="1" stroke-dasharray="7 6"/><text x="565" y="262" class="small math" text-anchor="start">H(π)=0</text><text x="565" y="310" class="small" text-anchor="start">不能做 π 端非零的高通/带阻</text><rect x="25" y="376" width="910" height="141" rx="12" fill="#f2f7f4" stroke="#dce8e3"/><text x="44" y="413" class="accent" text-anchor="start">III 型</text><text x="44" y="455" class="small" text-anchor="start">奇对称 / N 奇数</text><line x1="282" y1="440.5" x2="536" y2="440.5" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><line x1="290.0" y1="440.5" x2="290.0" y2="421.1818181818182" stroke="#087d8c" stroke-width="2"/><circle cx="290.0" cy="421.1818181818182" r="4" fill="#087d8c"/><line x1="347.5" y1="440.5" x2="347.5" y2="405.72727272727275" stroke="#087d8c" stroke-width="2"/><circle cx="347.5" cy="405.72727272727275" r="4" fill="#087d8c"/><line x1="405.0" y1="440.5" x2="405.0" y2="440.5" stroke="#087d8c" stroke-width="2"/><circle cx="405.0" cy="440.5" r="4" fill="#087d8c"/><line x1="462.5" y1="440.5" x2="462.5" y2="475.27272727272725" stroke="#087d8c" stroke-width="2"/><circle cx="462.5" cy="475.27272727272725" r="4" fill="#087d8c"/><line x1="520.0" y1="440.5" x2="520.0" y2="459.8181818181818" stroke="#087d8c" stroke-width="2"/><circle cx="520.0" cy="459.8181818181818" r="4" fill="#087d8c"/><line x1="405" y1="393" x2="405" y2="491" stroke="#adc5c2" stroke-width="1" stroke-dasharray="7 6"/><text x="565" y="415" class="small math" text-anchor="start">H(0)=H(π)=0</text><text x="565" y="463" class="small" text-anchor="start">可做带通；也可作微分/Hilbert类</text><rect x="25" y="529" width="910" height="141" rx="12" fill="#f2f7f4" stroke="#dce8e3"/><text x="44" y="566" class="accent" text-anchor="start">IV 型</text><text x="44" y="608" class="small" text-anchor="start">奇对称 / N 偶数</text><line x1="282" y1="593.5" x2="536" y2="593.5" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><line x1="290.0" y1="593.5" x2="290.0" y2="585.7727272727273" stroke="#087d8c" stroke-width="2"/><circle cx="290.0" cy="585.7727272727273" r="4" fill="#087d8c"/><line x1="336.0" y1="593.5" x2="336.0" y2="570.3181818181818" stroke="#087d8c" stroke-width="2"/><circle cx="336.0" cy="570.3181818181818" r="4" fill="#087d8c"/><line x1="382.0" y1="593.5" x2="382.0" y2="554.8636363636364" stroke="#087d8c" stroke-width="2"/><circle cx="382.0" cy="554.8636363636364" r="4" fill="#087d8c"/><line x1="428.0" y1="593.5" x2="428.0" y2="632.1363636363636" stroke="#087d8c" stroke-width="2"/><circle cx="428.0" cy="632.1363636363636" r="4" fill="#087d8c"/><line x1="474.0" y1="593.5" x2="474.0" y2="616.6818181818181" stroke="#087d8c" stroke-width="2"/><circle cx="474.0" cy="616.6818181818181" r="4" fill="#087d8c"/><line x1="520.0" y1="593.5" x2="520.0" y2="601.2272727272727" stroke="#087d8c" stroke-width="2"/><circle cx="520.0" cy="601.2272727272727" r="4" fill="#087d8c"/><line x1="405" y1="546" x2="405" y2="644" stroke="#adc5c2" stroke-width="1" stroke-dasharray="7 6"/><text x="565" y="568" class="small math" text-anchor="start">H(0)=0</text><text x="565" y="616" class="small" text-anchor="start">可做高通/带通，不能做直流非零低通</text><text x="32" y="744" class="small" text-anchor="start">教材“第一类/第二类”常指偶/奇对称两组；这里 I–IV 指四种长度组合。</text></svg>