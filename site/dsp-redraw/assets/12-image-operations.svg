<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title"><title id="title">图像运算的数学角色：加减、局部处理与几何变换</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536d83"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17344c;font-size:24px} .small{font-size:20px;fill:#536d83} .head{font-size:32px;font-weight:700} .label{font-size:26px;font-weight:600}</style><rect width="100%" height="100%" fill="#fff"/><text x="35" y="55" class="head" text-anchor="start">图像也是数组，但各操作不是同一件事</text><rect x="40" y="105" width="420" height="115" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="250.0" y="153.5" class="label" text-anchor="middle">像素加 / 减</text><text x="250.0" y="187.5" class="small" text-anchor="middle">同一位置组合或求差</text><rect x="540" y="105" width="420" height="115" rx="14" fill="#eaf6f3" stroke="#bfceda"/><text x="750.0" y="153.5" class="label" text-anchor="middle">平滑 / 锐化 / 边缘</text><text x="750.0" y="187.5" class="small" text-anchor="middle">利用邻域关系处理局部变化</text><rect x="40" y="270" width="420" height="115" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="250.0" y="318.5" class="label" text-anchor="middle">旋转 / 拼接</text><text x="250.0" y="352.5" class="small" text-anchor="middle">坐标变换、插值、配准</text><rect x="540" y="270" width="420" height="115" rx="14" fill="#eaf6f3" stroke="#bfceda"/><text x="750.0" y="318.5" class="label" text-anchor="middle">篡改检测 / 水印</text><text x="750.0" y="352.5" class="small" text-anchor="middle">被动找不一致 / 主动嵌入信息</text><text x="500" y="445" class="" text-anchor="middle" style="fill:#b85109">对齐不同、亮度变化、截断与饱和都会影响结果</text><text x="500" y="505" class="small" text-anchor="middle">以流程重绘原P8–12、19–23；不把未给出的算法冒称复现。</text></svg>