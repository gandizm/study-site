<svg xmlns="http://www.w3.org/2000/svg" width="960" height="565" viewBox="0 0 960 565" role="img" aria-labelledby="t d"><title id="t">延时乘法加法三个基本单元</title><desc id="d">z负一次方表示一个样本延迟；常数乘法改变幅度；加法器将支路相加。</desc><metadata>{}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#16314a"/></marker></defs><rect width="960" height="565" fill="#fbfdff"/><g font-family="system-ui, Noto Sans CJK SC, sans-serif"><text x="40" y="42" font-size="30" fill="#16314a" text-anchor="start" font-weight="700">三种基本运算，连成一个滤波器</text><text x="40" y="115" font-size="26" fill="#155eaa" text-anchor="start" font-weight="400">延时一拍</text><text x="250" y="115" font-size="26" fill="#16314a" text-anchor="start" font-weight="400">x(n)</text><line x1="320.00" y1="105.00" x2="390.00" y2="105.00" stroke="#16314a" stroke-width="2.5"/><polygon points="390,105 379.0,100.5 379.0,109.5" fill="#16314a"/><rect x="395" y="75" width="120" height="60" rx="8" fill="white" stroke="#155eaa" stroke-width="2.5"/><text x="455.0" y="114.0" font-size="25" fill="#155eaa" text-anchor="middle" font-weight="400">z⁻¹</text><line x1="520.00" y1="105.00" x2="590.00" y2="105.00" stroke="#16314a" stroke-width="2.5"/><polygon points="590,105 579.0,100.5 579.0,109.5" fill="#16314a"/><text x="620" y="115" font-size="26" fill="#16314a" text-anchor="start" font-weight="400">x(n−1)</text><text x="40" y="225" font-size="26" fill="#155eaa" text-anchor="start" font-weight="400">乘常数</text><text x="250" y="225" font-size="26" fill="#16314a" text-anchor="start" font-weight="400">x(n)</text><line x1="320.00" y1="215.00" x2="390.00" y2="215.00" stroke="#16314a" stroke-width="2.5"/><polygon points="390,215 379.0,210.5 379.0,219.5" fill="#16314a"/><rect x="395" y="185" width="120" height="60" rx="8" fill="white" stroke="#155eaa" stroke-width="2.5"/><text x="455.0" y="224.0" font-size="25" fill="#155eaa" text-anchor="middle" font-weight="400">× a</text><line x1="520.00" y1="215.00" x2="590.00" y2="215.00" stroke="#16314a" stroke-width="2.5"/><polygon points="590,215 579.0,210.5 579.0,219.5" fill="#16314a"/><text x="620" y="225" font-size="26" fill="#16314a" text-anchor="start" font-weight="400">a x(n)</text><text x="40" y="335" font-size="26" fill="#155eaa" text-anchor="start" font-weight="400">相加</text><text x="250" y="335" font-size="26" fill="#16314a" text-anchor="start" font-weight="400">u(n)</text><line x1="320.00" y1="325.00" x2="430.00" y2="325.00" stroke="#16314a" stroke-width="2.5"/><polygon points="430,325 419.0,320.5 419.0,329.5" fill="#16314a"/><circle cx="455" cy="325" r="23" fill="white" stroke="#16314a" stroke-width="2.5"/><text x="455" y="334" font-size="30" fill="#16314a" text-anchor="middle" font-weight="400">+</text><line x1="480.00" y1="325.00" x2="590.00" y2="325.00" stroke="#16314a" stroke-width="2.5"/><polygon points="590,325 579.0,320.5 579.0,329.5" fill="#16314a"/><text x="620" y="335" font-size="26" fill="#16314a" text-anchor="start" font-weight="400">u(n)+v(n)</text><line x1="455.00" y1="410.00" x2="455.00" y2="350.00" stroke="#16314a" stroke-width="2.5"/><polygon points="455,350 450.5,361.0 459.5,361.0" fill="#16314a"/><text x="500" y="405" font-size="25" fill="#16314a" text-anchor="start" font-weight="400">v(n)</text><text x="40" y="475" font-size="24" fill="#b45412" text-anchor="start" font-weight="400">箭头表示信号方向；逐拍计算的反馈环须含延时，避免代数环。</text><text x="40" y="525" font-size="23" fill="#577082" text-anchor="start" font-weight="400">本课讨论线性常系数网络，不代表所有数字算法都只有这三种运算。</text></g></svg>