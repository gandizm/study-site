<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1060" viewBox="0 0 960 1060" role="img" aria-labelledby="t d"><title id="t">八抽头对称FIR的七个零点</title><desc id="d">负一；单位圆正负六十度；半径零点八与一点二五的正负六十度，并给出匹配原多项式的线性相位三级结构。</desc><metadata>{&quot;coefficients&quot;: [1, -2.05, 3.2025, -1.05, -1.05, 3.2025, -2.05, 1], &quot;zeros&quot;: [[-1.0, 0.0], [0.5000000000000001, 0.8660254037844386], [0.5000000000000001, -0.8660254037844386], [0.40000000000000013, 0.6928203230275509], [0.40000000000000013, -0.6928203230275509], [0.6250000000000001, 1.0825317547305482], [0.6250000000000001, -1.0825317547305482]]}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#16314a"/></marker></defs><rect width="960" height="1060" fill="#fbfdff"/><g font-family="system-ui, Noto Sans CJK SC, sans-serif"><text x="40" y="42" font-size="30" fill="#16314a" text-anchor="start" font-weight="700">原 P63–64：7个零点，不是7个极点</text><line x1="130.00" y1="360.00" x2="820.00" y2="360.00" stroke="#16314a" stroke-width="2.5"/><polygon points="820,360 809.0,355.5 809.0,364.5" fill="#16314a"/><line x1="470.00" y1="650.00" x2="470.00" y2="70.00" stroke="#16314a" stroke-width="2.5"/><polygon points="470,70 465.5,81.0 474.5,81.0" fill="#16314a"/><text x="825" y="390" font-size="22" fill="#577082" text-anchor="start" font-weight="400">Re(z)</text><text x="490" y="90" font-size="22" fill="#577082" text-anchor="start" font-weight="400">Im(z)</text><text x="675" y="390" font-size="22" fill="#577082" text-anchor="start" font-weight="400">1</text><circle cx="470" cy="360" r="195" fill="none" stroke="#d9e4eb" stroke-width="3"/><circle cx="275.00" cy="360.00" r="8" fill="white" stroke="#155eaa" stroke-width="3"/><circle cx="567.50" cy="191.13" r="8" fill="white" stroke="#155eaa" stroke-width="3"/><circle cx="567.50" cy="528.87" r="8" fill="white" stroke="#155eaa" stroke-width="3"/><circle cx="548.00" cy="224.90" r="8" fill="white" stroke="#155eaa" stroke-width="3"/><circle cx="548.00" cy="495.10" r="8" fill="white" stroke="#155eaa" stroke-width="3"/><circle cx="591.88" cy="148.91" r="8" fill="white" stroke="#155eaa" stroke-width="3"/><circle cx="591.88" cy="571.09" r="8" fill="white" stroke="#155eaa" stroke-width="3"/><text x="250" y="400" font-size="25" fill="#155eaa" text-anchor="start" font-weight="400">−1</text><text x="710" y="135" font-size="25" fill="#155eaa" text-anchor="start" font-weight="400">r = 1.25</text><line x1="705.00" y1="139.00" x2="600.00" y2="149.00" stroke="#155eaa" stroke-width="2"/><text x="680" y="205" font-size="25" fill="#155eaa" text-anchor="start" font-weight="400">r = 1</text><line x1="675.00" y1="199.00" x2="576.00" y2="191.00" stroke="#155eaa" stroke-width="2"/><text x="645" y="255" font-size="25" fill="#155eaa" text-anchor="start" font-weight="400">r = 0.8</text><line x1="640.00" y1="247.00" x2="558.00" y2="225.00" stroke="#155eaa" stroke-width="2"/><text x="710" y="300" font-size="22" fill="#577082" text-anchor="start" font-weight="400">辐角均为 π/3</text><text x="710" y="600" font-size="23" fill="#577082" text-anchor="start" font-weight="400">下半平面为共轭零点</text><text x="40" y="690" font-size="23" fill="#16314a" text-anchor="start" font-weight="400">非零零点按 z₀、z₀*、1/z₀、1/z₀* 配组；重复位置只计实际重数。</text><text x="40" y="735" font-size="23" fill="#b45412" text-anchor="start" font-weight="400">本例长度8、阶数7，对称中心为3.5；必须有 z=−1 零点。</text><text x="40" y="810" font-size="26" fill="#155eaa" text-anchor="start" font-weight="400">按原多项式重建：三节各自都具有线性相位</text><text x="20" y="895" font-size="26" fill="#16314a" text-anchor="start" font-weight="400">x</text><line x1="45.00" y1="885.00" x2="75.00" y2="885.00" stroke="#16314a" stroke-width="2.5"/><polygon points="75,885 64.0,880.5 64.0,889.5" fill="#16314a"/><rect x="80" y="850" width="130" height="70" rx="8" fill="white" stroke="#155eaa" stroke-width="2.5"/><text x="145.0" y="894.0" font-size="25" fill="#155eaa" text-anchor="middle" font-weight="400">1 + q</text><line x1="215.00" y1="885.00" x2="255.00" y2="885.00" stroke="#16314a" stroke-width="2.5"/><polygon points="255,885 244.0,880.5 244.0,889.5" fill="#16314a"/><rect x="260" y="850" width="200" height="70" rx="8" fill="white" stroke="#155eaa" stroke-width="2.5"/><text x="360.0" y="894.0" font-size="25" fill="#155eaa" text-anchor="middle" font-weight="400">1 − q + q²</text><line x1="465.00" y1="885.00" x2="505.00" y2="885.00" stroke="#16314a" stroke-width="2.5"/><polygon points="505,885 494.0,880.5 494.0,889.5" fill="#16314a"/><rect x="510" y="850" width="350" height="70" rx="8" fill="white" stroke="#155eaa" stroke-width="2.5"/><text x="685.0" y="894.0" font-size="25" fill="#155eaa" text-anchor="middle" font-weight="400">四阶对称节</text><line x1="865.00" y1="885.00" x2="910.00" y2="885.00" stroke="#16314a" stroke-width="2.5"/><polygon points="910,885 899.0,880.5 899.0,889.5" fill="#16314a"/><text x="920" y="895" font-size="26" fill="#16314a" text-anchor="start" font-weight="400">y</text><text x="40" y="975" font-size="24" fill="#16314a" text-anchor="start" font-weight="400">四阶节：1 − 2.05q + 3.2025q² − 2.05q³ + q⁴；q = z⁻¹</text><text x="40" y="1020" font-size="23" fill="#b45412" text-anchor="start" font-weight="400">每节可按对称系数折叠实现；这里不沿用原P64不匹配的流图。</text></g></svg>