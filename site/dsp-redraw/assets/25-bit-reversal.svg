6172" stroke-width="2"/><text x="635" y="477" class="small" text-anchor="middle">+</text><circle cx="635" cy="594" r="15" fill="white" stroke="#496172" stroke-width="2"/><text x="635" y="601" class="small" text-anchor="middle">−</text><line x1="635" y1="160" x2="875" y2="160" stroke="#8aa2ac" stroke-width="2"/><line x1="635" y1="408" x2="875" y2="408" stroke="#8aa2ac" stroke-width="2"/><line x1="657" y1="160" x2="853" y2="408" stroke="#496172" stroke-width="2"/><line x1="657" y1="408" x2="853" y2="160" stroke="#087d8c" stroke-width="2"/><text x="673" y="435" class="small accent" text-anchor="start">W₈<tspan baseline-shift="super" font-size="75%">0</tspan></text><circle cx="875" cy="160" r="15" fill="white" stroke="#496172" stroke-width="2"/><text x="875" y="167" class="small" text-anchor="middle">+</text><circle cx="875" cy="408" r="15" fill="white" stroke="#496172" stroke-width="2"/><text x="875" y="415" class="small" text-anchor="middle">−</text><line x1="635" y1="222" x2="875" y2="222" stroke="#8aa2ac" stroke-width="2"/><line x1="635" y1="470" x2="875" y2="470" stroke="#8aa2ac" stroke-width="2"/><line x1="657" y1="222" x2="853" y2="470" stroke="#496172" stroke-width="2"/><line x1="657" y1="470" x2="853" y2="222" stroke="#087d8c" stroke-width="2"/><text x="673" y="497" class="small accent" text-anchor="start">W₈<tspan baseline-shift="super" font-size="75%">1</tspan></text><circle cx="875" cy="222" r="15" fill="white" stroke="#496172" stroke-width="2"/><text x="875" y="229" class="small" text-anchor="middle">+</text><circle cx="875" cy="470" r="15" fill="white" stroke="#496172" stroke-width="2"/><text x="875" y="477" class="small" text-anchor="middle">−</text><line x1="635" y1="284" x2="875" y2="284" stroke="#8aa2ac" stroke-width="2"/><line x1="635" y1="532" x2="875" y2="532" stroke="#8aa2ac" stroke-width="2"/><line x1="657" y1="284" x2="853" y2="532" stroke="#496172" stroke-width="2"/><line x1="657" y1="532" x2="853" y2="284" stroke="#087d8c" stroke-width="2"/><text x="673" y="559" class="small accent" text-anchor="start">W₈<tspan baseline-shift="super" font-size="75%">2</tspan></text><circle cx="875" cy="284" r="15" fill="white" stroke="#496172" stroke-width="2"/><text x="875" y="291" class="small" text-anchor="middle">+</text><circle cx="875" cy="532" r="15" fill="white" stroke="#496172" stroke-width="2"/><text x="875" y="539" class="small" text-anchor="middle">−</text><line x1="635" y1="346" x2="875" y2="346" stroke="#8aa2ac" stroke-width="2"/><line x1="635" y1="594" x2="875" y2="594" stroke="#8aa2ac" stroke-width="2"/><line x1="657" y1="346" x2="853" y2="594" stroke="#496172" stroke-width="2"/><line x1="657" y1="594" x2="853" y2="346" stroke="#087d8c" stroke-width="2"/><text x="673" y="621" class="small accent" text-anchor="start">W₈<tspan baseline-shift="super" font-size="75%">3</tspan></text><circle cx="875" cy="346" r="15" fill="white" stroke="#496172" stroke-width="2"/><text x="875" y="353" class="small" text-anchor="middle">+</text><circle cx="875" cy="594" r="15" fill="white" stroke="#496172" stroke-width="2"/><text x="875" y="601" class="small" text-anchor="middle">−</text><line x1="890" y1="160" x2="913" y2="160" stroke="#496172" stroke-width="2"/><text x="925" y="167" class="math" text-anchor="start">X(0)</text><line x1="890" y1="222" x2="913" y2="222" stroke="#496172" stroke-width="2"/><text x="925" y="229" class="math" text-anchor="start">X(1)</text><line x1="890" y1="284" x2="913" y2="284" stroke="#496172" stroke-width="2"/><text x="925" y="291" class="math" text-anchor="start">X(2)</text><line x1="890" y1="346" x2="913" y2="346" stroke="#496172" stroke-width="2"/><text x="925" y="353" class="math" text-anchor="start">X(3)</text><line x1="890" y1="408" x2="913" y2="408" stroke="#496172" stroke-width="2"/><text x="925" y="415" class="math" text-anchor="start">X(4)</text><line x1="890" y1="470" x2="913" y2="470" stroke="#496172" stroke-width="2"/><text x="925" y="477" class="math" text-anchor="start">X(5)</text><line x1="890" y1="532" x2="913" y2="532" stroke="#496172" stroke-width="2"/><text x="925" y="539" class="math" text-anchor="start">X(6)</text><line x1="890" y1="594" x2="913" y2="594" stroke="#496172" stroke-width="2"/><text x="925" y="601" class="math" text-anchor="start">X(7)</text><text x="32" y="690" class="small" text-anchor="start">位反转示例：3 = 011₂ → 110₂ = 6；不是把数组从尾到头倒放。</text><text x="32" y="722" class="small" text-anchor="start">连线交叉处无节点不相加。旋转因子属于下输入 v；每个输出节点按上式计算。</text></svg>