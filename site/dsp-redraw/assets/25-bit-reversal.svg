<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc"><title id="title">八点DIT的位反转与三级蝶形</title><desc id="desc">左侧输入依次为x0,x4,x2,x6,x1,x5,x3,x7。三级蝶距1,2,4，块长2,4,8，输出为X0到X7。每对蝶形上支路为u+t，下支路为u-t，t为所标旋转因子乘下支路输入。交叉线没有节点不相加。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#496172"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183545;font-size:24px} .small{font-size:20px;fill:#496172} .heading{font-size:31px;font-weight:700} .accent{fill:#087d8c} .warm{fill:#aa4b20} .math{font-family:"DejaVu Sans","Noto Sans CJK SC",sans-serif}</style><rect width="100%" height="100%" fill="#fcfdfb"/><text x="32" y="49" class="heading" text-anchor="start">八点 DIT：输入位反转，输出自然序</text><text x="32" y="86" class="small math" text-anchor="start">每对 u、v：t = W₈ᵖ v；上输出 u+t，下输出 u−t</text><text x="155" y="124" class="small" text-anchor="middle">输入</text><text x="395" y="124" class="small" text-anchor="middle">第1级 · 蝶距1</text><text x="635" y="124" class="small" text-anchor="middle">第2级 · 蝶距2</text><text x="875" y="124" class="small" text-anchor="middle">第3级 · 蝶距4</text><text x="35" y="167" class="math" text-anchor="start">x(0)</text><line x1="105" y1="160" x2="155" y2="160" stroke="#496172" stroke-width="2"/><text x="35" y="229" class="math" text-anchor="start">x(4)</text><line x1="105" y1="222" x2="155" y2="222" stroke="#496172" stroke-width="2"/><text x="35" y="291" class="math" text-anchor="start">x(2)</text><line x1="105" y1="284" x2="155" y2="284" stroke="#496172" stroke-width="2"/><text x="35" y="353" class="math" text-anchor="start">x(6)</text><line x1="105" y1="346" x2="155" y2="346" stroke="#496172" stroke-width="2"/><text x="35" y="415" class="math" text-anchor="start">x(1)</text><line x1="105" y1="408" x2="155" y2="408" stroke="#496172" stroke-width="2"/><text x="35" y="477" class="math" text-anchor="start">x(5)</text><line x1="105" y1="470" x2="155" y2="470" stroke="#496172" stroke-width="2"/><text x="35" y="539" class="math" text-anchor="start">x(3)</text><line x1="105" y1="532" x2="155" y2="532" stroke="#496172" stroke-width="2"/><text x="35" y="601" class="math" text-anchor="start">x(7)</text><line x1="105" y1="594" x2="155" y2="594" stroke="#496172" stroke-width="2"/><line x1="155" y1="160" x2="395" y2="160" stroke="#8aa2ac" stroke-width="2"/><line x1="155" y1="222" x2="395" y2="222" stroke="#8aa2ac" stroke-width="2"/><line x1="177" y1="160" x2="373" y2="222" stroke="#496172" stroke-width="2"/><line x1="177" y1="222" x2="373" y2="160" stroke="#087d8c" stroke-width="2"/><text x="193" y="249" class="small accent" text-anchor="start">W₈<tspan baseline-shift="super" font-size="75%">0</tspan></text><circle cx="395" cy="160" r="15" fill="white" stroke="#496172" stroke-width="2"/><text x="395" y="167" class="small" text-anchor="middle">+</text><circle cx="395" cy="222" r="15" fill="white" stroke="#496172" stroke-width="2"/><text x="395" y="229" class="small" text-anchor="middle">−</text><line x1="155" y1="284" x2="395" y2="284" stroke="#8aa2ac" stroke-width="2"/><line x1="155" y1="346" x2="395" y2="346" stroke="#8aa2ac" stroke-width="2"/><line x1="177" y1="284" x2="373" y2="346" stroke="#496172" stroke-width="2"/><line x1="177" y1="346" x2="373" y2="284" stroke="#087d8c" stroke-width="2"/><text x="193" y="373" class="small accent" text-anchor="start">W₈<tspan baseline-shift="super" font-size="75%">0</tspan></text><circle cx="395" cy="284" r="15" fill="white" stroke="#496172" stroke-width="2"/><text x="395" y="291" class="small" text-anchor="middle">+</text><circle cx="395" cy="346" r="15" fill="white" stroke="#496172" stroke-width="2"/><text x="395" y="353" class="small" text-anchor="middle">−</text><line x1="155" y1="408" x2="395" y2="408" stroke="#8aa2ac" stroke-width="2"/><line x1="155" y1="470" x2="395" y2="470" stroke="