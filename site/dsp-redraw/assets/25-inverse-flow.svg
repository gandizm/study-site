<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">用正向FFT算IDFT</title><desc id="desc">对频域数组先共轭，再做一次正向FFT，结果再次共轭，最后除以N。两次共轭和一个1/N都不可遗漏。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#496172"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183545;font-size:24px} .small{font-size:20px;fill:#496172} .heading{font-size:31px;font-weight:700} .accent{fill:#087d8c} .warm{fill:#aa4b20} .math{font-family:"DejaVu Sans","Noto Sans CJK SC",sans-serif}</style><rect width="100%" height="100%" fill="#fcfdfb"/><text x="32" y="49" class="heading" text-anchor="start">一个正向 FFT，也能完成逆变换</text><rect x="30" y="109" width="180" height="110" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="120" y="151" class="math" text-anchor="middle">X(k)</text><text x="120" y="188" class="small" text-anchor="middle">频域输入</text><line x1="210" y1="164" x2="246" y2="164" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="250" y="109" width="180" height="110" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="340" y="151" class="math" text-anchor="middle">取共轭</text><text x="340" y="188" class="small" text-anchor="middle">X*(k)</text><line x1="430" y1="164" x2="466" y2="164" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="470" y="109" width="180" height="110" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="560" y="151" class="math" text-anchor="middle">FFT</text><text x="560" y="188" class="small" text-anchor="middle">正向核</text><line x1="650" y1="164" x2="686" y2="164" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><rect x="690" y="109" width="180" height="110" rx="12" fill="#eaf4f1" stroke="#adc5c2"/><text x="780" y="151" class="math" text-anchor="middle">取共轭 / N</text><text x="780" y="188" class="small" text-anchor="middle">得到 x(n)</text><text x="32" y="267" class="small" text-anchor="start">检查：FFT 的负指数仍保持原样；改变方向的是前后两次共轭。</text></svg>