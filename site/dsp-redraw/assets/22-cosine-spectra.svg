<svg xmlns="http://www.w3.org/2000/svg" width="640" height="970" viewBox="0 0 640 970" role="img" aria-labelledby="title desc"><title id="title">22-cosine-spectra</title><desc id="desc">三个频谱对比：原模拟信号在±200π冲激权重2π；冲激采样谱在±200π+800πr处权重800π；DTFT在±π/2+2πr处权重2π。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17253b"/></marker></defs><rect width="640" height="970" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="42" font-size="28" fill="#17253b" text-anchor="start" font-weight="700">100 Hz余弦 · 400 Hz采样</text><text x="30" y="85" font-size="25" fill="#1768be" text-anchor="start" font-weight="700">原模拟频谱 Xₐ(jΩ)</text><text x="30" y="121" font-size="23" fill="#52637b" text-anchor="start" font-weight="400">每根箭头的权重：2π</text><line x1="60.00" y1="230.00" x2="605.00" y2="230.00" stroke="#17253b" stroke-width="2" marker-end="url(#arrow)"/><line x1="249.29" y1="230.00" x2="249.29" y2="160.00" stroke="#1768be" stroke-width="3.5" marker-end="url(#arrow)"/><line x1="400.71" y1="230.00" x2="400.71" y2="160.00" stroke="#1768be" stroke-width="3.5" marker-end="url(#arrow)"/><line x1="97.86" y1="226.00" x2="97.86" y2="235.00" stroke="#52637b" stroke-width="2"/><text x="97.85714285714286" y="264" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">−600</text><line x1="249.29" y1="226.00" x2="249.29" y2="235.00" stroke="#52637b" stroke-width="2"/><text x="249.28571428571428" y="264" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">−200</text><line x1="400.71" y1="226.00" x2="400.71" y2="235.00" stroke="#52637b" stroke-width="2"/><text x="400.7142857142857" y="264" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">200</text><line x1="552.14" y1="226.00" x2="552.14" y2="235.00" stroke="#52637b" stroke-width="2"/><text x="552.1428571428571" y="264" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">600</text><text x="320" y="303" font-size="22" fill="#52637b" text-anchor="middle" font-weight="400">Ω / π · rad/s</text><text x="30" y="340" font-size="25" fill="#087c76" text-anchor="start" font-weight="700">冲激采样谱 X̂ₐ(jΩ)</text><text x="30" y="376" font-size="23" fill="#52637b" text-anchor="start" font-weight="400">每根箭头的权重：800π</text><line x1="60.00" y1="485.00" x2="605.00" y2="485.00" stroke="#17253b" stroke-width="2" marker-end="url(#arrow)"/><line x1="104.17" y1="485.00" x2="104.17" y2="415.00" stroke="#087c76" stroke-width="3.5" marker-end="url(#arrow)"/><line x1="192.50" y1="485.00" x2="192.50" y2="415.00" stroke="#087c76" stroke-width="3.5" marker-end="url(#arrow)"/><line x1="280.83" y1="485.00" x2="280.83" y2="415.00" stroke="#087c76" stroke-width="3.5" marker-end="url(#arrow)"/><line x1="369.17" y1="485.00" x2="369.17" y2="415.00" stroke="#087c76" stroke-width="3.5" marker-end="url(#arrow)"/><line x1="457.50" y1="485.00" x2="457.50" y2="415.00" stroke="#087c76" stroke-width="3.5" marker-end="url(#arrow)"/><line x1="545.83" y1="485.00" x2="545.83" y2="415.00" stroke="#087c76" stroke-width="3.5" marker-end="url(#arrow)"/><line x1="104.17" y1="481.00" x2="104.17" y2="490.00" stroke="#52637b" stroke-width="2"/><text x="104.16666666666666" y="519" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">−1000</text><line x1="192.50" y1="481.00" x2="192.50" y2="490.00" stroke="#52637b" stroke-width="2"/><text x="192.5" y="519" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">−600</text><line x1="280.83" y1="481.00" x2="280.83" y2="490.00" stroke="#52637b" stroke-width="2"/><text x="280.83333333333337" y="519" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">−200</text><line x1="369.17" y1="481.00" x2="369.17" y2="490.00" stroke="#52637b" stroke-width="2"/><text x="369.1666666666667" y="519" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">200</text><line x1="457.50" y1="481.00" x2="457.50" y2="490.00" stroke="#52637b" stroke-width="2"/><text x="457.5" y="519" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">600</text><line x1="545.83" y1="481.00" x2="545.83" y2="490.00" stroke="#52637b" stroke-width="2"/><text x="545.8333333333333" y="519" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">1000</text><text x="320" y="558" font-size="22" fill="#52637b" text-anchor="middle" font-weight="400">Ω / π · rad/s</text><text x="30" y="595" font-size="25" fill="#c34440" text-anchor="start" font-weight="700">样值序列的DTFT X(e<tspan baseline-shift="super" font-size="70%">jω</tspan>)</text><text x="30" y="631" font-size="23" fill="#52637b" text-anchor="start" font-weight="400">每根箭头的权重：2π</text><line x1="60.00" y1="740.00" x2="605.00" y2="740.00" stroke="#17253b" stroke-width="2" marker-end="url(#arrow)"/><line x1="126.25" y1="740.00" x2="126.25" y2="670.00" stroke="#c34440" stroke-width="3.5" marker-end="url(#arrow)"/><line x1="258.75" y1="740.00" x2="258.75" y2="670.00" stroke="#c34440" stroke-width="3.5" marker-end="url(#arrow)"/><line x1="391.25" y1="740.00" x2="391.25" y2="670.00" stroke="#c34440" stroke-width="3.5" marker-end="url(#arrow)"/><line x1="523.75" y1="740.00" x2="523.75" y2="670.00" stroke="#c34440" stroke-width="3.5" marker-end="url(#arrow)"/><line x1="60.00" y1="736.00" x2="60.00" y2="745.00" stroke="#52637b" stroke-width="2"/><text x="60.0" y="774" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">−2π</text><line x1="192.50" y1="736.00" x2="192.50" y2="745.00" stroke="#52637b" stroke-width="2"/><text x="192.5" y="774" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">−π</text><line x1="325.00" y1="736.00" x2="325.00" y2="745.00" stroke="#52637b" stroke-width="2"/><text x="325.0" y="774" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">0</text><line x1="457.50" y1="736.00" x2="457.50" y2="745.00" stroke="#52637b" stroke-width="2"/><text x="457.5" y="774" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">π</text><line x1="590.00" y1="736.00" x2="590.00" y2="745.00" stroke="#52637b" stroke-width="2"/><text x="590.0" y="774" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">2π</text><text x="320" y="813" font-size="22" fill="#52637b" text-anchor="middle" font-weight="400">ω · rad/sample</text><text x="320" y="895" font-size="26" fill="#17253b" text-anchor="middle" font-weight="700">频率轴不同，冲激权重也不同</text><text x="320" y="940" font-size="24" fill="#52637b" text-anchor="middle" font-weight="400">Ω轴：每800π重复；ω轴：每2π重复</text></g></svg>