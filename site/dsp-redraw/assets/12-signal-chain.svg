<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title"><title id="title">典型模拟输入输出DSP系统与数字相机数据路径</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536d83"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17344c;font-size:24px} .small{font-size:22px;fill:#536d83} .head{font-size:32px;font-weight:700} .label{font-size:26px;font-weight:600}</style><rect width="100%" height="100%" fill="#fff"/><text x="35" y="55" class="head" text-anchor="start">不是一块“DSP”方框包办全部</text><rect x="35" y="105" width="180" height="110" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="125.0" y="151.0" class="label" text-anchor="middle">抗混叠滤波</text><text x="125.0" y="185.0" class="small" text-anchor="middle">采样前限带</text><path d="M218 160L247 160" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="250" y="105" width="150" height="110" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="325.0" y="151.0" class="label" text-anchor="middle">A/D</text><text x="325.0" y="185.0" class="small" text-anchor="middle">采样 + 量化</text><path d="M403 160L447 160" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="105" width="180" height="110" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="540.0" y="151.0" class="label" text-anchor="middle">数字处理</text><text x="540.0" y="185.0" class="small" text-anchor="middle">数组 → 数组</text><path d="M633 160L677 160" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="680" y="105" width="150" height="110" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="755.0" y="151.0" class="label" text-anchor="middle">D/A</text><text x="755.0" y="185.0" class="small" text-anchor="middle">产生模拟输出</text><path d="M833 160L877 160" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="880" y="105" width="185" height="110" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="972.5" y="151.0" class="label" text-anchor="middle">重建滤波</text><text x="972.5" y="185.0" class="small" text-anchor="middle">抑制频谱镜像</text><text x="40" y="265" class="small" text-anchor="start">输入 xₐ(t) → 数值序列 x[n] → 数值序列 y[n] → 输出 yₐ(t)</text><text x="35" y="335" class="label" text-anchor="start">数字相机：也可以在数字域结束</text><rect x="40" y="385" width="235" height="100" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="157.5" y="426.0" class="label" text-anchor="middle">光学 + 图像传感器</text><text x="157.5" y="460.0" class="small" text-anchor="middle">空间采样</text><path d="M278 435L320 435" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="325" y="385" width="185" height="100" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="417.5" y="426.0" class="label" text-anchor="middle">A/D</text><text x="417.5" y="460.0" class="small" text-anchor="middle">像素数值</text><path d="M513 435L555 435" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="560" y="385" width="225" height="100" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="672.5" y="426.0" class="label" text-anchor="middle">图像处理 / 编码</text><text x="672.5" y="460.0" class="small" text-anchor="middle">原图未给完整算法</text><path d="M788 435L830 435" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="835" y="385" width="225" height="100" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="947.5" y="426.0" class="label" text-anchor="middle">存储 / 传输</text><text x="947.5" y="460.0" class="small" text-anchor="middle">不必再经过D/A</text><text x="550" y="555" class="" text-anchor="middle" style="fill:#b85109">采样前已经发生的混叠，不能靠后面的普通数字滤波保证修复。</text><text x="550" y="610" class="small" text-anchor="middle">按原P5–6核心路径重绘；辅助电源和接口不在本图展开。</text></svg>