<svg xmlns="http://www.w3.org/2000/svg" width="960" height="810" viewBox="0 0 960 810" role="img" aria-labelledby="t d"><title id="t">四类理想数字滤波器的通带</title><desc id="d">低通保留低频、高通保留高频、带通保留中间一段、带阻压低中间一段。</desc><metadata>{&quot;ideal&quot;: true, &quot;halfPeriod&quot;: [0, 3.141592653589793]}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#16314a"/></marker></defs><rect width="960" height="810" fill="#fbfdff"/><g font-family="system-ui, Noto Sans CJK SC, sans-serif"><text x="40" y="42" font-size="30" fill="#16314a" text-anchor="start" font-weight="700">四种频率选择：看 0 ≤ ω ≤ π 的一半</text><text x="40" y="135" font-size="28" fill="#155eaa" text-anchor="start" font-weight="400">低通</text><line x1="260.00" y1="160.00" x2="880.00" y2="160.00" stroke="#16314a" stroke-width="2"/><path d="M260 160 L260 100 L477.0 100 L477.0 160" fill="none" stroke="#087f79" stroke-width="4"/><text x="260" y="190" font-size="22" fill="#577082" text-anchor="middle" font-weight="400">0</text><text x="880" y="190" font-size="22" fill="#577082" text-anchor="middle" font-weight="400">π</text><text x="910" y="190" font-size="24" fill="#577082" text-anchor="start" font-weight="400">ω</text><text x="40" y="285" font-size="28" fill="#155eaa" text-anchor="start" font-weight="400">高通</text><line x1="260.00" y1="310.00" x2="880.00" y2="310.00" stroke="#16314a" stroke-width="2"/><path d="M663.0 310 L663.0 250 L880 250 L880 310" fill="none" stroke="#087f79" stroke-width="4"/><text x="260" y="340" font-size="22" fill="#577082" text-anchor="middle" font-weight="400">0</text><text x="880" y="340" font-size="22" fill="#577082" text-anchor="middle" font-weight="400">π</text><text x="910" y="340" font-size="24" fill="#577082" text-anchor="start" font-weight="400">ω</text><text x="40" y="435" font-size="28" fill="#155eaa" text-anchor="start" font-weight="400">带通</text><line x1="260.00" y1="460.00" x2="880.00" y2="460.00" stroke="#16314a" stroke-width="2"/><path d="M446.0 460 L446.0 400 L663.0 400 L663.0 460" fill="none" stroke="#087f79" stroke-width="4"/><text x="260" y="490" font-size="22" fill="#577082" text-anchor="middle" font-weight="400">0</text><text x="880" y="490" font-size="22" fill="#577082" text-anchor="middle" font-weight="400">π</text><text x="910" y="490" font-size="24" fill="#577082" text-anchor="start" font-weight="400">ω</text><text x="40" y="585" font-size="28" fill="#155eaa" text-anchor="start" font-weight="400">带阻</text><line x1="260.00" y1="610.00" x2="880.00" y2="610.00" stroke="#16314a" stroke-width="2"/><path d="M260 610 L260 550 L446.0 550 L446.0 610" fill="none" stroke="#087f79" stroke-width="4"/><path d="M663.0 610 L663.0 550 L880 550 L880 610" fill="none" stroke="#087f79" stroke-width="4"/><text x="260" y="640" font-size="22" fill="#577082" text-anchor="middle" font-weight="400">0</text><text x="880" y="640" font-size="22" fill="#577082" text-anchor="middle" font-weight="400">π</text><text x="910" y="640" font-size="24" fill="#577082" text-anchor="start" font-weight="400">ω</text><text x="40" y="690" font-size="24" fill="#b45412" text-anchor="start" font-weight="400">理想示意，不是可直接实现的砖墙滤波器。</text><text x="40" y="730" font-size="24" fill="#16314a" text-anchor="start" font-weight="400">实系数数字滤波器：关于 0 镜像，再按 2π 周期重复。</text><text x="40" y="770" font-size="24" fill="#577082" text-anchor="start" font-weight="400">模拟频率轴是 Ω（rad/s），不具有这种 2π 周期。</text></g></svg>