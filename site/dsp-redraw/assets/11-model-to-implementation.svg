<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title"><title id="title">从输入输出定义到仿真和实现，误差和约束逐步增加</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536d83"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#17344c;font-size:24px} .small{font-size:20px;fill:#536d83} .head{font-size:32px;font-weight:700} .label{font-size:26px;font-weight:600}</style><rect width="100%" height="100%" fill="#fff"/><text x="40" y="55" class="head" text-anchor="start">先有可检查的算法，再选实现</text><rect x="50" y="110" width="250" height="120" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="175.0" y="161.0" class="label" text-anchor="middle">写数学关系</text><text x="175.0" y="195.0" class="small" text-anchor="middle">输入 / 输出 / 条件</text><path d="M302 170L365 170" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="370" y="110" width="260" height="120" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="500.0" y="161.0" class="label" text-anchor="middle">用数据核验</text><text x="500.0" y="195.0" class="small" text-anchor="middle">小例子 / 边界 / 误差</text><path d="M632 170L695 170" fill="none" stroke="#536d83" stroke-width="3" marker-end="url(#arrow)"/><rect x="700" y="110" width="250" height="120" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="825.0" y="161.0" class="label" text-anchor="middle">部署到平台</text><text x="825.0" y="195.0" class="small" text-anchor="middle">计算机 / 处理器 / FPGA</text><text x="500" y="300" class="" text-anchor="middle" style="fill:#b85109">相同算法 ≠ 相同速度、精度、功耗、延迟</text><rect x="120" y="350" width="760" height="95" rx="14" fill="#edf5fb" stroke="#bfceda"/><text x="500.0" y="388.5" class="label" text-anchor="middle">实现后仍要核验</text><text x="500.0" y="422.5" class="small" text-anchor="middle">字长、舍入、饱和、边界处理都可能改变实际结果</text></svg>