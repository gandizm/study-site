<svg xmlns="http://www.w3.org/2000/svg" width="640" height="535" viewBox="0 0 640 535" role="img" aria-labelledby="title desc"><title id="title">21-unit-circle</title><desc id="desc">Z平面单位圆与角度ω，提示先确认单位圆位于Z变换收敛域。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17253b"/></marker></defs><rect width="640" height="535" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif"><text x="32" y="42" font-size="30" fill="#17253b" text-anchor="start" font-weight="700">单位圆：r = 1</text><circle cx="295" cy="245" r="145" fill="#eef6ff" stroke="#1768be" stroke-width="4"/><line x1="90.00" y1="245.00" x2="550.00" y2="245.00" stroke="#17253b" stroke-width="2" marker-end="url(#arrow)"/><line x1="295.00" y1="430.00" x2="295.00" y2="75.00" stroke="#17253b" stroke-width="2" marker-end="url(#arrow)"/><line x1="295.00" y1="245.00" x2="410.43" y2="157.25" stroke="#087c76" stroke-width="4"/><circle cx="410.43" cy="157.25" r="6" fill="#087c76" stroke="#087c76" stroke-width="2"/><path d="M 350 245 A 55 55 0 0 0 338.8 211.7" fill="none" stroke="#087c76" stroke-width="3"/><text x="357" y="224" font-size="28" fill="#087c76" text-anchor="start" font-weight="400">ω</text><text x="420" y="130" font-size="28" fill="#087c76" text-anchor="start" font-weight="400">z = e<tspan baseline-shift="super" font-size="70%">jω</tspan></text><text x="550" y="281" font-size="24" fill="#17253b" text-anchor="end" font-weight="400">Re z</text><text x="312" y="92" font-size="24" fill="#17253b" text-anchor="start" font-weight="400">Im z</text><text x="278" y="277" font-size="24" fill="#17253b" text-anchor="start" font-weight="400">0</text><text x="448" y="277" font-size="24" fill="#17253b" text-anchor="start" font-weight="400">1</text><text x="320" y="465" font-size="27" fill="#17253b" text-anchor="middle" font-weight="700">单位圆必须落在收敛域内</text><text x="320" y="506" font-size="25" fill="#52637b" text-anchor="middle" font-weight="400">再把 X(z) 的 z 换成 e<tspan baseline-shift="super" font-size="70%">jω</tspan></text></g></svg>