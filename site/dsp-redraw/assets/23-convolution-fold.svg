<svg xmlns="http://www.w3.org/2000/svg" width="960" height="605" viewBox="0 0 960 605" role="img" aria-labelledby="title desc"><title id="title">四点数组自卷积的时域折回</title><desc id="desc">线性结果1 4 8 10 8 4 1；四点圆周卷积为9 8 9 10。</desc><metadata>{&quot;input&quot;: [1, 2, 2, 1], &quot;linear&quot;: [1, 4, 8, 10, 8, 4, 1], &quot;circular4&quot;: [9, 8, 9, 10]}</metadata><rect width="960" height="605" fill="#fbfdff"/><g font-family="system-ui, Noto Sans CJK SC, sans-serif"><text x="45" y="42" font-size="30" fill="#16314a" text-anchor="start" font-weight="700">线性结果折回相加，得到圆周结果</text><text x="45" y="92" font-size="25" fill="#16314a" text-anchor="start" font-weight="400">线性自卷积：长 4 + 4 − 1 = 7</text><line x1="70.00" y1="260.00" x2="880.00" y2="260.00" stroke="#16314a" stroke-width="2"/><line x1="90.00" y1="260.00" x2="90.00" y2="247.50" stroke="#155eaa" stroke-width="3"/><circle cx="90.00" cy="247.50" r="5" fill="#155eaa"/><text x="90.0" y="290" font-size="20" fill="#577082" text-anchor="middle" font-weight="400">0</text><text x="90.0" y="235.5" font-size="22" fill="#155eaa" text-anchor="middle" font-weight="400">1</text><line x1="202.86" y1="260.00" x2="202.86" y2="210.00" stroke="#155eaa" stroke-width="3"/><circle cx="202.86" cy="210.00" r="5" fill="#155eaa"/><text x="202.85714285714286" y="290" font-size="20" fill="#577082" text-anchor="middle" font-weight="400">1</text><text x="202.85714285714286" y="198.0" font-size="22" fill="#155eaa" text-anchor="middle" font-weight="400">4</text><line x1="315.71" y1="260.00" x2="315.71" y2="160.00" stroke="#155eaa" stroke-width="3"/><circle cx="315.71" cy="160.00" r="5" fill="#155eaa"/><text x="315.7142857142857" y="290" font-size="20" fill="#577082" text-anchor="middle" font-weight="400">2</text><text x="315.7142857142857" y="148.0" font-size="22" fill="#155eaa" text-anchor="middle" font-weight="400">8</text><line x1="428.57" y1="260.00" x2="428.57" y2="135.00" stroke="#155eaa" stroke-width="3"/><circle cx="428.57" cy="135.00" r="5" fill="#155eaa"/><text x="428.57142857142856" y="290" font-size="20" fill="#577082" text-anchor="middle" font-weight="400">3</text><text x="428.57142857142856" y="123.0" font-size="22" fill="#155eaa" text-anchor="middle" font-weight="400">10</text><line x1="541.43" y1="260.00" x2="541.43" y2="160.00" stroke="#155eaa" stroke-width="3"/><circle cx="541.43" cy="160.00" r="5" fill="#155eaa"/><text x="541.4285714285714" y="290" font-size="20" fill="#577082" text-anchor="middle" font-weight="400">4</text><text x="541.4285714285714" y="148.0" font-size="22" fill="#155eaa" text-anchor="middle" font-weight="400">8</text><line x1="654.29" y1="260.00" x2="654.29" y2="210.00" stroke="#155eaa" stroke-width="3"/><circle cx="654.29" cy="210.00" r="5" fill="#155eaa"/><text x="654.2857142857143" y="290" font-size="20" fill="#577082" text-anchor="middle" font-weight="400">5</text><text x="654.2857142857143" y="198.0" font-size="22" fill="#155eaa" text-anchor="middle" font-weight="400">4</text><line x1="767.14" y1="260.00" x2="767.14" y2="247.50" stroke="#155eaa" stroke-width="3"/><circle cx="767.14" cy="247.50" r="5" fill="#155eaa"/><text x="767.1428571428571" y="290" font-size="20" fill="#577082" text-anchor="middle" font-weight="400">6</text><text x="767.1428571428571" y="235.5" font-size="22" fill="#155eaa" text-anchor="middle" font-weight="400">1</text><text x="896" y="290" font-size="22" fill="#577082" text-anchor="start" font-weight="400">n</text><text x="45" y="335" font-size="24" fill="#b45412" text-anchor="start" font-weight="400">N = 4：n = 4、5、6 分别折回 0、1、2</text><line x1="70.00" y1="500.00" x2="880.00" y2="500.00" stroke="#16314a" stroke-width="2"/><line x1="90.00" y1="500.00" x2="90.00" y2="387.50" stroke="#087f79" stroke-width="3"/><circle cx="90.00" cy="387.50" r="5" fill="#087f79"/><text x="90.0" y="530" font-size="20" fill="#577082" text-anchor="middle" font-weight="400">0</text><text x="90.0" y="375.5" font-size="22" fill="#087f79" text-anchor="middle" font-weight="400">9</text>