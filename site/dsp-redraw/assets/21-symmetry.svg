<svg xmlns="http://www.w3.org/2000/svg" width="640" height="695" viewBox="0 0 640 695" role="img" aria-labelledby="title desc"><title id="title">21-symmetry</title><desc id="desc">两种交叉分解：时间共轭对称分量对应频谱实虚分量；时间实虚分量对应频谱共轭对称分量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17253b"/></marker></defs><rect width="640" height="695" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif"><text x="30" y="42" font-size="29" fill="#17253b" text-anchor="start" font-weight="700">两种分解，方向不要混</text><rect x="30" y="75" width="580" height="90" rx="12" fill="#f0f6fc" stroke="#d8e2ed"/><text x="320" y="108" font-size="24" fill="#17253b" text-anchor="middle" font-weight="400">时间：共轭对称分解</text><text x="320" y="147" font-size="29" fill="#1768be" text-anchor="middle" font-weight="400">x = xₑ + xₒ</text><line x1="320.00" y1="175.00" x2="320.00" y2="207.00" stroke="#17253b" stroke-width="2" marker-end="url(#arrow)"/><text x="348" y="200" font-size="22" fill="#52637b" text-anchor="start" font-weight="400">DTFT</text><rect x="30" y="220" width="580" height="90" rx="12" fill="#eef8f6" stroke="#d8e2ed"/><text x="320" y="253" font-size="24" fill="#17253b" text-anchor="middle" font-weight="400">频谱：实部 + 纯虚部</text><text x="320" y="292" font-size="29" fill="#087c76" text-anchor="middle" font-weight="400">X = Re X + j Im X</text><rect x="30" y="330" width="580" height="90" rx="12" fill="#f0f6fc" stroke="#d8e2ed"/><text x="320" y="363" font-size="24" fill="#17253b" text-anchor="middle" font-weight="400">时间：实部 + 纯虚部</text><text x="320" y="402" font-size="29" fill="#1768be" text-anchor="middle" font-weight="400">x = Re x + j Im x</text><line x1="320.00" y1="430.00" x2="320.00" y2="462.00" stroke="#17253b" stroke-width="2" marker-end="url(#arrow)"/><text x="348" y="455" font-size="22" fill="#52637b" text-anchor="start" font-weight="400">DTFT</text><rect x="30" y="475" width="580" height="90" rx="12" fill="#eef8f6" stroke="#d8e2ed"/><text x="320" y="508" font-size="24" fill="#17253b" text-anchor="middle" font-weight="400">频谱：共轭对称分解</text><text x="320" y="547" font-size="29" fill="#087c76" text-anchor="middle" font-weight="400">X = Xₑ + Xₒ</text><text x="320" y="625" font-size="27" fill="#17253b" text-anchor="middle" font-weight="700">实序列 → 频谱实偶、虚奇</text><text x="320" y="669" font-size="24" fill="#c34440" text-anchor="middle" font-weight="400">“实”不等于“实偶”，也不等于“实谱”</text></g></svg>