<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc"><title id="title">四点采样把第零与第四个样值相加</title><desc id="desc">五个样值各为1，索引4绕回余数0，因此四点IDFT首项为2。</desc><metadata>{&quot;N&quot;: 4, &quot;assignments&quot;: [0, 1, 2, 3, 0], &quot;output&quot;: [2, 1, 1, 1]}</metadata><rect width="960" height="530" fill="#fbfdff"/><g font-family="system-ui, Noto Sans CJK SC, sans-serif"><text x="45" y="42" font-size="30" fill="#16314a" text-anchor="start" font-weight="700">频率取 N 点 ↔ 时间相隔 N 的值相加</text><circle cx="100.00" cy="135.00" r="30" fill="#155eaa"/><text x="100" y="143" font-size="24" fill="white" text-anchor="middle" font-weight="400">1</text><text x="100" y="190" font-size="22" fill="#577082" text-anchor="middle" font-weight="400">n=0</text><circle cx="270.00" cy="135.00" r="30" fill="#155eaa"/><text x="270" y="143" font-size="24" fill="white" text-anchor="middle" font-weight="400">1</text><text x="270" y="190" font-size="22" fill="#577082" text-anchor="middle" font-weight="400">n=1</text><circle cx="440.00" cy="135.00" r="30" fill="#155eaa"/><text x="440" y="143" font-size="24" fill="white" text-anchor="middle" font-weight="400">1</text><text x="440" y="190" font-size="22" fill="#577082" text-anchor="middle" font-weight="400">n=2</text><circle cx="610.00" cy="135.00" r="30" fill="#155eaa"/><text x="610" y="143" font-size="24" fill="white" text-anchor="middle" font-weight="400">1</text><text x="610" y="190" font-size="22" fill="#577082" text-anchor="middle" font-weight="400">n=3</text><circle cx="780.00" cy="135.00" r="30" fill="#155eaa"/><text x="780" y="143" font-size="24" fill="white" text-anchor="middle" font-weight="400">1</text><text x="780" y="190" font-size="22" fill="#577082" text-anchor="middle" font-weight="400">n=4</text><circle cx="100.00" cy="375.00" r="35" fill="#087f79"/><text x="100" y="383" font-size="28" fill="white" text-anchor="middle" font-weight="400">2</text><text x="100" y="433" font-size="22" fill="#577082" text-anchor="middle" font-weight="400">余数 0</text><circle cx="270.00" cy="375.00" r="35" fill="#087f79"/><text x="270" y="383" font-size="28" fill="white" text-anchor="middle" font-weight="400">1</text><text x="270" y="433" font-size="22" fill="#577082" text-anchor="middle" font-weight="400">余数 1</text><circle cx="440.00" cy="375.00" r="35" fill="#087f79"/><text x="440" y="383" font-size="28" fill="white" text-anchor="middle" font-weight="400">1</text><text x="440" y="433" font-size="22" fill="#577082" text-anchor="middle" font-weight="400">余数 2</text><circle cx="610.00" cy="375.00" r="35" fill="#087f79"/><text x="610" y="383" font-size="28" fill="white" text-anchor="middle" font-weight="400">1</text><text x="610" y="433" font-size="22" fill="#577082" text-anchor="middle" font-weight="400">余数 3</text><line x1="100.00" y1="210.00" x2="100.00" y2="325.00" stroke="#d9e4eb" stroke-width="3"/><line x1="270.00" y1="210.00" x2="270.00" y2="325.00" stroke="#d9e4eb" stroke-width="3"/><line x1="440.00" y1="210.00" x2="440.00" y2="325.00" stroke="#d9e4eb" stroke-width="3"/><line x1="610.00" y1="210.00" x2="610.00" y2="325.00" stroke="#d9e4eb" stroke-width="3"/><path d="M 780 210 C 780 280 100 270 100 325" fill="none" stroke="#b45412" stroke-width="4"/><text x="470" y="240" font-size="26" fill="#b45412" text-anchor="middle" font-weight="400">4 mod 4 = 0</text><text x="45" y="488" font-size="25" fill="#16314a" text-anchor="start" font-weight="400">同一盒只留下和：2 = 1+1，无法知道原来各占多少。</text></g></svg>