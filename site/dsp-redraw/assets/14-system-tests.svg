<svg xmlns="http://www.w3.org/2000/svg" width="640" height="645" viewBox="0 0 640 645" role="img" aria-labelledby="title"><title id="title">线性和时不变的两条比较路径</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#172e41"/></marker></defs><rect width="640" height="645" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="24" y="36" font-size="27" fill="#172e41" text-anchor="start" font-weight="bold">线性与时不变：比较两条路径</text><text x="26" y="85" font-size="23" fill="#176879" text-anchor="start" font-weight="normal">线性：先组合再过系统 = 先过系统再组合</text><rect x="28" y="115" width="245" height="66" rx="10" fill="#eaf5f6" stroke="#176879" stroke-width="2"/><text x="150.5" y="156.0" font-size="24" fill="#176879" text-anchor="middle" font-weight="normal">a₁x₁+a₂x₂</text><line x1="281" y1="148" x2="337" y2="148" stroke="#172e41" stroke-width="2" marker-end="url(#arrow)"/><rect x="347" y="115" width="260" height="66" rx="10" fill="#eaf5f6" stroke="#176879" stroke-width="2"/><text x="477.0" y="156.0" font-size="24" fill="#176879" text-anchor="middle" font-weight="normal">T[a₁x₁+a₂x₂]</text><text x="318" y="220" font-size="24" fill="#a94f18" text-anchor="middle" font-weight="normal">应相等</text><rect x="28" y="250" width="245" height="66" rx="10" fill="#eaf5f6" stroke="#176879" stroke-width="2"/><text x="150.5" y="291.0" font-size="24" fill="#176879" text-anchor="middle" font-weight="normal">分别输入 T</text><line x1="281" y1="283" x2="337" y2="283" stroke="#172e41" stroke-width="2" marker-end="url(#arrow)"/><rect x="347" y="250" width="260" height="66" rx="10" fill="#eaf5f6" stroke="#176879" stroke-width="2"/><text x="477.0" y="291.0" font-size="24" fill="#176879" text-anchor="middle" font-weight="normal">a₁T[x₁]+a₂T[x₂]</text><text x="26" y="378" font-size="22" fill="#176879" text-anchor="start" font-weight="normal">时不变：先移位再过系统 = 先过系统再移位</text><rect x="28" y="410" width="245" height="66" rx="10" fill="#eaf5f6" stroke="#176879" stroke-width="2"/><text x="150.5" y="451.0" font-size="24" fill="#176879" text-anchor="middle" font-weight="normal">x[n−m] → T</text><line x1="281" y1="443" x2="337" y2="443" stroke="#172e41" stroke-width="2" marker-end="url(#arrow)"/><rect x="347" y="410" width="260" height="66" rx="10" fill="#eaf5f6" stroke="#176879" stroke-width="2"/><text x="477.0" y="451.0" font-size="24" fill="#176879" text-anchor="middle" font-weight="normal">T[x[n−m]]</text><text x="318" y="515" font-size="23" fill="#a94f18" text-anchor="middle" font-weight="normal">每个整数 m 都应相等</text><rect x="28" y="546" width="245" height="66" rx="10" fill="#eaf5f6" stroke="#176879" stroke-width="2"/><text x="150.5" y="587.0" font-size="24" fill="#176879" text-anchor="middle" font-weight="normal">x[n] → T → 移 m</text><line x1="281" y1="579" x2="337" y2="579" stroke="#172e41" stroke-width="2" marker-end="url(#arrow)"/><rect x="347" y="546" width="260" height="66" rx="10" fill="#eaf5f6" stroke="#176879" stroke-width="2"/><text x="477.0" y="587.0" font-size="24" fill="#176879" text-anchor="middle" font-weight="normal">y[n−m]</text></g></svg>