<svg xmlns="http://www.w3.org/2000/svg" width="960" height="710" viewBox="0 0 960 710" role="img" aria-labelledby="t d"><title id="t">FIR频率采样结构的正确求和形式</title><desc id="d">一个梳状器接多个并联一阶共振支路，之后除以N。</desc><metadata>{}</metadata><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#16314a"/></marker></defs><rect width="960" height="710" fill="#fbfdff"/><g font-family="system-ui, Noto Sans CJK SC, sans-serif"><text x="40" y="42" font-size="30" fill="#16314a" text-anchor="start" font-weight="700">FIR 也可以含反馈：频率采样实现</text><text x="40" y="96" font-size="25" fill="#b45412" text-anchor="start" font-weight="400">关键是“梳状器 × 并联支路之和”，不是所有支路连乘</text><text x="35" y="330" font-size="28" fill="#16314a" text-anchor="start" font-weight="400">x</text><line x1="65.00" y1="320.00" x2="120.00" y2="320.00" stroke="#16314a" stroke-width="2.5"/><polygon points="120,320 109.0,315.5 109.0,324.5" fill="#16314a"/><rect x="125" y="280" width="205" height="80" rx="8" fill="white" stroke="#155eaa" stroke-width="2.5"/><text x="227.5" y="329.0" font-size="25" fill="#155eaa" text-anchor="middle" font-weight="400">1 − z⁻ᴺ</text><line x1="335.00" y1="320.00" x2="380.00" y2="320.00" stroke="#16314a" stroke-width="2.5"/><polygon points="380,320 369.0,315.5 369.0,324.5" fill="#16314a"/><circle cx="385" cy="320" r="4" fill="#16314a"/><path d="M385 320 L385 180 L435 180" fill="none" stroke="#16314a" stroke-width="2.5"/><polygon points="435.0,180.0 424.0,175.5 424.0,184.5" fill="#16314a"/><rect x="440" y="140" width="290" height="80" rx="8" fill="white" stroke="#087f79" stroke-width="2.5"/><text x="585.0" y="189.0" font-size="25" fill="#087f79" text-anchor="middle" font-weight="400">k = 0 支路</text><path d="M735 180 L790 180 L790 295" fill="none" stroke="#16314a" stroke-width="2.5"/><polygon points="790.0,295.0 794.5,284.0 785.5,284.0" fill="#16314a"/><path d="M385 320 L385 320 L435 320" fill="none" stroke="#16314a" stroke-width="2.5"/><polygon points="435.0,320.0 424.0,315.5 424.0,324.5" fill="#16314a"/><rect x="440" y="280" width="290" height="80" rx="8" fill="white" stroke="#087f79" stroke-width="2.5"/><text x="585.0" y="329.0" font-size="25" fill="#087f79" text-anchor="middle" font-weight="400">k = 1 支路</text><path d="M735 320 L765 320" fill="none" stroke="#16314a" stroke-width="2.5"/><polygon points="765.0,320.0 754.0,315.5 754.0,324.5" fill="#16314a"/><path d="M385 320 L385 500 L435 500" fill="none" stroke="#16314a" stroke-width="2.5"/><polygon points="435.0,500.0 424.0,495.5 424.0,504.5" fill="#16314a"/><rect x="440" y="460" width="290" height="80" rx="8" fill="white" stroke="#087f79" stroke-width="2.5"/><text x="585.0" y="509.0" font-size="25" fill="#087f79" text-anchor="middle" font-weight="400">k = N−1 支路</text><path d="M735 500 L790 500 L790 345" fill="none" stroke="#16314a" stroke-width="2.5"/><polygon points="790.0,345.0 785.5,356.0 794.5,356.0" fill="#16314a"/><text x="565" y="422" font-size="32" fill="#087f79" text-anchor="middle" font-weight="400">⋮</text><circle cx="790" cy="320" r="23" fill="white" stroke="#16314a" stroke-width="2.5"/><text x="790" y="329" font-size="30" fill="#16314a" text-anchor="middle" font-weight="400">+</text><line x1="815.00" y1="320.00" x2="845.00" y2="320.00" stroke="#16314a" stroke-width="2.5"/><polygon points="845,320 834.0,315.5 834.0,324.5" fill="#16314a"/><rect x="850" y="285" width="75" height="70" rx="8" fill="white" stroke="#155eaa" stroke-width="2.5"/><text x="887.5" y="329.0" font-size="25" fill="#155eaa" text-anchor="middle" font-weight="400">1/N</text><line x1="887.00" y1="360.00" x2="887.00" y2="390.00" stroke="#16314a" stroke-width="2.5"/><polygon points="887,390 891.5,379.0 882.5,379.0" fill="#16314a"/><text x="887" y="425" font-size="28" fill="#16314a" text-anchor="middle" font-weight="400">y</text><text x="40" y="610" font-size="26" fill="#16314a" text-anchor="start" font-weight="400">第 k 支路：H(k) / [1 − exp(j2πk/N) z⁻¹]</text><text x="40" y="665" font-size="23" fill="#b45412" text-anchor="start" font-weight="400">外部零状态传递函数可精确抵消；内部共振状态与有限字长仍需警惕。</text></g></svg>