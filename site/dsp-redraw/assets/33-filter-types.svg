<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">低通高通带通带阻的频率选择</title><desc id="desc">四个正频率半区间0到π的理想数字幅度模板。低通保留低频，高通保留高频，带通保留中间频段，带阻阻断中间频段。真实设计必须给过渡带和容限，这些硬边缘仅作类型识别。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#496172"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183545;font-size:24px} .small{font-size:20px;fill:#496172} .heading{font-size:31px;font-weight:700} .accent{fill:#087d8c} .warm{fill:#aa4b20} .math{font-family:"DejaVu Sans","Noto Sans CJK SC",sans-serif}</style><rect width="100%" height="100%" fill="#fcfdfb"/><text x="32" y="49" class="heading" text-anchor="start">先说保留哪段频率，再填写容限</text><text x="50" y="115" class="accent" text-anchor="start">低通</text><line x1="50" y1="243" x2="400" y2="243" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><line x1="50" y1="243" x2="50" y2="133" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><path d="M50,153 L165.2,153 L165.2,243 L370,243" fill="none" stroke="#087d8c" stroke-width="3"/><text x="42" y="271" class="small" text-anchor="start">0</text><text x="370" y="271" class="small" text-anchor="middle">π</text><text x="400" y="271" class="small" text-anchor="start">ω</text><text x="26" y="161" class="small" text-anchor="start">1</text><text x="490" y="115" class="accent" text-anchor="start">高通</text><line x1="490" y1="243" x2="840" y2="243" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><line x1="490" y1="243" x2="490" y2="133" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><path d="M490,243 L694.8,243 L694.8,153 L810,153" fill="none" stroke="#087d8c" stroke-width="3"/><text x="482" y="271" class="small" text-anchor="start">0</text><text x="810" y="271" class="small" text-anchor="middle">π</text><text x="840" y="271" class="small" text-anchor="start">ω</text><text x="466" y="161" class="small" text-anchor="start">1</text><text x="50" y="325" class="accent" text-anchor="start">带通</text><line x1="50" y1="453" x2="400" y2="453" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><line x1="50" y1="453" x2="50" y2="343" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><path d="M50,453 L146.0,453 L146.0,363 L274.0,363 L274.0,453 L370,453" fill="none" stroke="#087d8c" stroke-width="3"/><text x="42" y="481" class="small" text-anchor="start">0</text><text x="370" y="481" class="small" text-anchor="middle">π</text><text x="400" y="481" class="small" text-anchor="start">ω</text><text x="26" y="371" class="small" text-anchor="start">1</text><text x="490" y="325" class="accent" text-anchor="start">带阻</text><line x1="490" y1="453" x2="840" y2="453" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><line x1="490" y1="453" x2="490" y2="343" stroke="#496172" stroke-width="2" marker-end="url(#arrow)"/><path d="M490,363 L586.0,363 L586.0,453 L714.0,453 L714.0,363 L810,363" fill="none" stroke="#087d8c" stroke-width="3"/><text x="482" y="481" class="small" text-anchor="start">0</text><text x="810" y="481" class="small" text-anchor="middle">π</text><text x="840" y="481" class="small" text-anchor="start">ω</text><text x="466" y="371" class="small" text-anchor="start">1</text><text x="32" y="531" class="small" text-anchor="start">只画 0≤ω≤π；实系数数字滤波器的幅度按偶对称和 2π 周期扩展。</text></svg>