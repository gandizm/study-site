<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>通原辅导 · 响应式验收预览</title><style>body{margin:0;font:15px/1.6 system-ui;background:#e8ede5;color:#17372f}header{padding:12px 18px;display:flex;align-items:center;flex-wrap:wrap;gap:9px;background:#fffefa}button,select,a{font:inherit;min-height:42px;border:1px solid #b7c9bb;background:#fffefa;color:#17372f;border-radius:6px;padding:6px 10px}main{overflow:auto;padding:12px 18px}iframe{display:block;border:1px solid #b7c9bb;background:white;width:390px;height:1000px;max-width:none}p{margin:8px 18px;font-size:13px}output{min-width:75px}</style></head><body><header><strong>响应式验收</strong><button type="button" data-width="320">320 px</button><button type="button" data-width="390">390 px</button><button type="button" data-width="900">900 px</button><output id="size">390 px</output><label>内容 <select id="page"><option value="homework">第五章八题</option><option value="course">三章辅导</option></select></label><a href="../communications-course-redraw.html">直接阅读 ↗</a></header><p>同一页面在真实窄幅iframe中的布局预览。可操作导航、折叠、公式横滑和大图；这不是手机硬件模拟。</p><main><iframe id="preview" title="通原辅导响应式预览" src="../communications-ch5-homework.html#q1"></iframe></main><script>const frame=document.querySelector('#preview');document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.style.width=button.dataset.width+'px';document.querySelector('#size').textContent=button.dataset.width+' px';}));document.querySelector('#page').addEventListener('change',event=>{frame.src=event.target.value==='course'?'../communications-course-redraw.html#ch5-00':'../communications-ch5-homework.html#q1';});</script></body></html>
