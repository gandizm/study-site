<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1120" viewBox="0 0 1100 1120" role="img" aria-labelledby="title desc"><title id="title">逐步读三角频谱、平移副本和混叠</title><desc id="desc">先画从负200至200赫兹的三角频谱。以400赫兹为间隔复制时端点相接；以300赫兹复制时100至200赫兹重叠，150赫兹处两个0.25相加为0.5。示意先除以抽样率显示归一化高度。</desc><rect width="1100" height="1120" fill="#fffefa"/><g font-family="system-ui, Noto Sans CJK SC, sans-serif" fill="#17372f"><text x="42" y="48" font-size="29" fill="#17372f" text-anchor="start" font-weight="bold">原谱 → 只移一份 → 找交叠 → 加高度</text><text x="42" y="87" font-size="21" fill="#60736b" text-anchor="start" font-weight="normal">横轴f是频率，不是时间。前面先画形状；真实理想抽样谱还要乘fs。</text><text x="42" y="135" font-size="23" fill="#17372f" text-anchor="start" font-weight="bold">① 原谱：中心0，底边−200～200 Hz</text><text x="45" y="180" font-size="18" fill="#17372f" text-anchor="start" font-weight="normal">归一化高度</text><line x1="130" y1="293" x2="1040" y2="293" stroke="#60736b" stroke-width="2"/><line x1="400.0" y1="302" x2="400.0" y2="161" stroke="#60736b" stroke-width="2"/><polyline points="208.00,293.00 400.00,173.00 592.00,293.00" fill="none" stroke="#17745b" stroke-width="4"/><text x="388.0" y="168" font-size="20" fill="#17745b" text-anchor="end" font-weight="normal">1</text><line x1="208.0" y1="293" x2="208.0" y2="300" stroke="#60736b" stroke-width="2"/><text x="208.0" y="323" font-size="19" fill="#17372f" text-anchor="middle" font-weight="normal">-200</text><line x1="400.0" y1="293" x2="400.0" y2="300" stroke="#60736b" stroke-width="2"/><text x="400.0" y="323" font-size="19" fill="#17372f" text-anchor="middle" font-weight="normal">0</text><line x1="592.0" y1="293" x2="592.0" y2="300" stroke="#60736b" stroke-width="2"/><text x="592.0" y="323" font-size="19" fill="#17372f" text-anchor="middle" font-weight="normal">200</text><text x="1010" y="353" font-size="19" fill="#17372f" text-anchor="end" font-weight="normal">f / Hz</text><text x="44" y="357" font-size="21" fill="#17745b" text-anchor="start" font-weight="normal">先看每个点对应哪个频率。</text><text x="42" y="407" font-size="23" fill="#17372f" text-anchor="start" font-weight="bold">② fs=400 Hz：右副本移到400，底边200～600</text><text x="45" y="452" font-size="18" fill="#17372f" text-anchor="start" font-weight="normal">归一化高度</text><line x1="130" y1="565" x2="1040" y2="565" stroke="#60736b" stroke-width="2"/><line x1="400.0" y1="574" x2="400.0" y2="433" stroke="#60736b" stroke-width="2"/><polyline points="208.00,565.00 400.00,445.00 592.00,565.00" fill="none" stroke="#17745b" stroke-width="4"/><text x="388.0" y="440" font-size="20" fill="#17745b" text-anchor="end" font-weight="normal">1</text><line x1="208.0" y1="565" x2="208.0" y2="572" stroke="#60736b" stroke-width="2"/><text x="208.0" y="595" font-size="19" fill="#17372f" text-anchor="middle" font-weight="normal">-200</text><line x1="400.0" y1="565" x2="400.0" y2="572" stroke="#60736b" stroke-width="2"/><text x="400.0" y="595" font-size="19" fill="#17372f" text-anchor="middle" font-weight="normal">0</text><line x1="592.0" y1="565" x2="592.0" y2="572" stroke="#60736b" stroke-width="2"/><text x="592.0" y="595" font-size="19" fill="#17372f" text-anchor="middle" font-weight="normal">200</text><line x1="784.0" y1="565" x2="784.0" y2="572" stroke="#60736b" stroke-width="2"/><text x="784.0" y="595" font-size="19" fill="#17372f" text-anchor="middle" font-weight="normal">400</text><line x1="976.0" y1="565" x2="976.0" y2="572" stroke="#60736b" stroke-width="2"/><text x="976.0" y="595" font-size="19" fill="#17372f" text-anchor="middle" font-weight="normal">600</text><text x="1010" y="625" font-size="19" fill="#17372f" text-anchor="end" font-weight="normal">f / Hz</text><polyline points="592.00,565.00 784.00,445.00 976.00,565.00" fill="none" stroke="#416dab" stroke-width="4" stroke-dasharray="9 6"/><text x="784.0" y="430" font-size="19" fill="#416dab" text-anchor="middle" font-weight="normal">只复制右边这一份</text><text x="44" y="629" font-size="21" fill="#17745b" text-anchor="start" font-weight="normal">只在200 Hz的零值端点接触。</text><text x="42" y="679" font-size="23" fill="#17372f" text-anchor="start" font-weight="bold">③ fs=300 Hz：右副本移到300，底边100～500</text><text x="45" y="724" font-size="18" fill="#17372f" text-anchor="start" font-weight="normal">归一化高度</text><line x1="130" y1="837" x2="1040" y2="837" stroke="#60736b" stroke-width="2"/><line x1="400.0" y1="846" x2="400.0" y2="705" stroke="#60736b" stroke-width="2"/><polyline points="208.00,837.00 400.00,717.00 592.00,837.00" fill="none" stroke="#17745b" stroke-width="4"/><text x="388.0" y="712" font-size="20" fill="#17745b" text-anchor="end" font-weight="normal">1</text><line x1="208.0" y1="837" x2="208.0" y2="844" stroke="#60736b" stroke-width="2"/><text x="208.0" y="867" font-size="19" fill="#17372f" text-anchor="middle" font-weight="normal">-200</text><line x1="400.0" y1="837" x2="400.0" y2="844" stroke="#60736b" stroke-width="2"/><text x="400.0" y="867" font-size="19" fill="#17372f" text-anchor="middle" font-weight="normal">0</text><line x1="496.0" y1="837" x2="496.0" y2="844" stroke="#60736b" stroke-width="2"/><text x="496.0" y="867" font-size="19" fill="#17372f" text-anchor="middle" font-weight="normal">100</text><line x1="592.0" y1="837" x2="592.0" y2="844" stroke="#60736b" stroke-width="2"/><text x="592.0" y="867" font-size="19" fill="#17372f" text-anchor="middle" font-weight="normal">200</text><line x1="688.0" y1="837" x2="688.0" y2="844" stroke="#60736b" stroke-width="2"/><text x="688.0" y="867" font-size="19" fill="#17372f" text-anchor="middle" font-weight="normal">300</text><line x1="880.0" y1="837" x2="880.0" y2="844" stroke="#60736b" stroke-width="2"/><text x="880.0" y="867" font-size="19" fill="#17372f" text-anchor="middle" font-weight="normal">500</text><text x="1010" y="897" font-size="19" fill="#17372f" text-anchor="end" font-weight="normal">f / Hz</text><polyline points="496.00,837.00 688.00,717.00 880.00,837.00" fill="none" stroke="#416dab" stroke-width="4" stroke-dasharray="9 6"/><text x="688.0" y="702" font-size="19" fill="#416dab" text-anchor="middle" font-weight="normal">只复制右边这一份</text><rect x="496.0" y="717" width="96.0" height="120" fill="#bd761b" opacity="0.14"/><line x1="544.0" y1="837" x2="544.0" y2="777" stroke="#bd761b" stroke-width="3"/><circle cx="544.0" cy="807" r="5" fill="#bd761b"/><line x1="496.0" y1="777" x2="592.0" y2="777" stroke="#b74642" stroke-width="5"/><text x="42" y="945" font-size="21" fill="#b74642" text-anchor="start" font-weight="normal">150 Hz：0.25 + 0.25 = 0.50</text><text x="470" y="945" font-size="19" fill="#b74642" text-anchor="start" font-weight="normal">红色线段 = 重叠后的高度和</text><text x="44" y="901" font-size="21" fill="#17745b" text-anchor="start" font-weight="normal">100～200 Hz的重叠段必须逐点相加。</text><text x="42" y="1010" font-size="21" fill="#60736b" text-anchor="start" font-weight="normal">本图省略更远的副本，只教“先移一份”。完整周期谱见作业5.9.1。</text><text x="42" y="1060" font-size="24" fill="#17745b" text-anchor="start" font-weight="bold">fs=300 Hz时：150 Hz处实际高度 = 300 × 0.50 = 150。</text></g></svg>