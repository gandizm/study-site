<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">同一串 1 0 1 1：比特不变，线路码型可以变</title><desc id="desc">单极NRZ将1映射到正电平、0到0；双极NRZ将1映射到正电平、0到负电平；AMI的1交替极性，0为0。</desc><rect width="1000" height="550" fill="#fffefa"/><style>text{font-family:system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183a32}.title{font-size:27px;font-weight:750}.label{font-size:19px}.small{font-size:16px;fill:#61756d}.axis{stroke:#90a299;stroke-width:1.5}.grid{stroke:#dce5dd;stroke-width:1;stroke-dasharray:5 5}</style>
