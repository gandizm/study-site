<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">双极判决：噪声把两种发送值散成两团</title><desc id="desc">等概双极符号正负A叠加同方差高斯噪声，最优门限为零。发送正A却落到零左边，以及发送负A却落到零右边，构成错误。</desc><rect width="1000" height="420" fill="#fffefa"/><style>text{font-family:system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#183a32}.title{font-size:27px;font-weight:750}.label{font-size:19px}.small{font-size:16px;fill:#61756d}.axis{stroke:#90a299;stroke-width:1.5}.grid{stroke:#dce5dd;stroke-width:1;stroke-dasharray:5 5}</style>
