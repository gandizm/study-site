</symbol></defs></svg><main><h1>数学排版只读核验</h1><p>同一渲染器。行内使用 text style 与真实基线，行间保持 display style。</p><section><h2>用户截图同句</h2><p>假设平均到达率为 <span class="inline-math-scroll" style="line-height:0;vertical-align:-0.268657em"><svg class="formula inline" role="img" data-math-style="text" data-math-depth="0.268657" aria-label="\lambda=2\,\text{份}/\mathrm{s}" width="81.43" height="21.21" viewBox="0 0 55.023035 14.332397" style="width:4.602447em;height:1.198846em;--math-depth:0.268657em;display:block"><use href="#math-d47aa2ba5b1fdd4b522c"></use></svg></span>。观察 <span class="inline-math-scroll" style="line-height:0;vertical-align:-0.268657em"><svg class="formula inline" role="img" data-math-style="text" data-math-depth="0.268657" aria-label="t=0.5\,\mathrm{s}" width="64.70" height="21.21" viewBox="0 0 43.718034 14.332397" style="width:3.656831em;height:1.198846em;--math-depth:0.268657em;display:block"><use href="#math-4865baad5a815fd32296"></use></svg></span>，平均到达数就是 <span class="inline-math-scroll" style="line-height:0;vertical-align:-0.268657em"><svg class="formula inline" role="img" data-math-style="text" data-math-depth="0.268657" aria-label="\lambda t=1" width="50.07" height="19.47" viewBox="0 0 33.83159 13.155212" style="width:2.829871em;height:1.100378em;--math-depth:0.268657em;display:block"><use href="#math-5952ba8689445829f20a"></use></svg></span>。</p></section><section><h2>普通分式与中文基线</h2><p>平均间隔 <span class="inline-math-scroll" style="line-height:0;vertical-align:-0.540704em"><svg class="formula inline" role="img" data-math-style="text" data-math-depth="0.540704" aria-label="\frac{1}{\lambda}" width="9.08" height="26.64" viewBox="0 0 6.1334936 18.000092" style="width:0.513041em;height:1.505633em;--math-depth:0.540704em;display:block"><use href="#math-804ab93ded35dc1ab998"></use></svg></span> 与平均服务时间 <span class="inline-math-scroll" style="line-height:0;vertical-align:-0.540704em"><svg class="formula inline" role="img" data-math-style="text" data-math-depth="0.540704" aria-label="\frac{1}{\mu c}" width="14.74" height="26.64" viewBox="0 0 9.959143 18.000092" style="width:0.833041em;height:1.505633em;--math-depth:0.540704em;display:block"><use href="#math-1cf75dac35ea8cf008f7"></use></svg></span> 都是时间，前后文字保持同一行。</p></section><section><h2>嵌套分式</h2><p>这里的 <span class="inline-math-scroll" style="line-height:0;vertical-align:-0.765564em"><svg class="formula inline" role="img" data-math-style="text" data-math-depth="0.765564" aria-label="\frac{1}{1+\frac{a}{b}}" width="25.52" height="30.62" viewBox="0 0 17.245905 20.688324" style="width:1.442548em;height:1.730492em;--math-depth:0.765564em;display:block"><use href="#math-1a894dd775970fccb8ea"></use></svg></span> 是行内嵌套分式；完整解释接在它后面，不和分母重叠。</p></section><section><h2>上下标与单位</h2><p>条件 <span class="inline-math-scroll" style="line-height:0;vertical-align:-0.540705em"><svg class="formula inline" role="img" data-math-style="text" data-math-depth="0.540705" aria-label="P_k(t)=\frac{(\lambda t)^k}{k!}e^{-\lambda t}" width="125.04" height="29.97" viewBox="0 0 84.489048 20.248383" style="width:7.067156em;height:1.693691em;--math-depth:0.540705em;display:block"><use href="#math-5adec271b036a2888996"></use></svg></span>，以及 <span class="inline-math-scroll" style="line-height:0;vertical-align:-0.345810em"><svg class="formula inline" role="img" data-math-style="text" data-math-depth="0.345810" aria-label="K_f=10\,\mathrm{rad}/(\mathrm{s}\cdot\mathrm{V})" width="149.31" height="22.58" viewBox="0 0 100.88198 15.254761" style="width:8.438357em;height:1.276000em;--math-depth:0.345810em;display:block"><use href="#math-b6312f567bc227b94567"></use></svg></span>，分别检查上下标与横排单位。</p></section><h2>标题中的 <span class="inline-math-scroll" style="line-height:0;vertical-align:-0.268657em"><svg class="formula inline" role="img" data-math-style="text" data-math-depth="0.268657" aria-label="75" width="19.08" height="19.47" viewBox="0 0 12.892185 13.155212" style="width:1.078378em;height:1.100378em;--math-depth:0.268657em;display:block"><use href="#math-ef3e08c0c4fb2ef2b702"></use></svg></span> 与 <span class="inline-math-scroll" style="line-height:0;vertical-align:-0.268657em"><svg class="formula inline" role="img" data-math-style="text" data-math-depth="0.268657" aria-label="6" width="10.43" height="19.47" viewBox="0 0 7.046093 13.155212" style="width:0.589376em;height:1.100378em;--math-depth:0.268657em;display:block"><use href="#math-cc654a8f2d40fe30b9e2"></use></svg></span></h2><div class="math"><svg class="formula " role="img" aria-label="\int_0^\infty t\lambda e^{-\lambda t}\,\mathrm{d}t=\frac1\lambda" width="141.90" height="62.71" viewBox="0 0 95.877429 42.37039" style="width:141.90px;height:62.71px"><use href="#math-760a2ee2954f9e478ae4"></use></svg></div><div class="math"><svg class="formula " role="img" aria-label="\begin{pmatrix}1&amp;\frac12\\\frac13&amp;1\end{pmatrix}" width="66.32" height="64.24" viewBox="0 0 44.81203 43.40738" style="width:66.32px;height:64.24px"><use href="#math-f40394a5cec8c6a1ccb7"></use></svg></div><div class="math"><svg class="formula " role="img" aria-label="\begin{aligned}T&amp;=\frac{1}{\mu c-\lambda}=\frac{1}{1-\rho}\frac{1}{\mu c}\\T_q&amp;=\frac{\rho}{1-\rho}\frac{1}{\mu c}\end{aligned}" width="184.99" height="92.57" viewBox="0 0 124.99476 62.546205" style="width:184.99px;height:92.57px"><use href="#math-ccf547eb6b11e09e2b5b"></use></svg></div></main><script src="/study-site/course-math-hints.js"></script></body></html>
