nt="4s" data-child="2b" data-side="右"/><path class="tree-edge" d="M570,348 L510,448" data-parent="7" data-child="3" data-side="左"/><path class="tree-edge" d="M570,348 L630,448" data-parent="7" data-child="4" data-side="右"/><g class="tree-node" transform="translate(260 48)" data-node="r"><circle r="26"/><text>41</text></g><g class="tree-node leaf" transform="translate(100 148)" data-node="17"><circle r="26"/><text>17</text></g><g class="tree-node" transform="translate(480 148)" data-node="24"><circle r="26"/><text>24</text></g><g class="tree-node" transform="translate(310 248)" data-node="9"><circle r="26"/><text>9</text></g><g class="tree-node" transform="translate(650 248)" data-node="15"><circle r="26"/><text>15</text></g><g class="tree-node" transform="translate(220 348)" data-node="4s"><circle r="26"/><text>4</text></g><g class="tree-node leaf" transform="translate(400 348)" data-node="5"><circle r="26"/><text>5</text></g><g class="tree-node" transform="translate(570 348)" data-node="7"><circle r="26"/><text>7</text></g><g class="tree-node leaf" transform="translate(780 348)" data-node="8"><circle r="26"/><text>8</text></g><g class="tree-node leaf" transform="translate(160 448)" data-node="2a"><circle r="26"/><text>2₁</text></g><g class="tree-node leaf" transform="translate(280 448)" data-node="2b"><circle r="26"/><text>2₂</text></g><g class="tree-node leaf" transform="translate(510 448)" data-node="3"><circle r="26"/><text>3</text></g><g class="tree-node leaf" transform="translate(630 448)" data-node="4"><circle r="26"/><text>4</text></g><text class="tree-foot" x="440.0" y="505">深绿色：原始叶子权值　浅色：合并得到的内部结点</text></svg>