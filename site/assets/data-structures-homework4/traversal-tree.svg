<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" role="img" aria-labelledby="traversal-title traversal-desc" class="tree-svg" data-tree="traversal"><title id="traversal-title">由中序 BDCEAFHG 与后序 DECBHGFA 唯一确定的二叉树</title><desc id="traversal-desc">A 的左孩子 B、右孩子 F；B 只有右孩子 C；C 的左孩子 D、右孩子 E；F 只有右孩子 G；G 只有左孩子 H。</desc><style>.tree-edge{stroke:#74938a;stroke-width:2.5;fill:none}.tree-node circle{fill:#f1f6ee;stroke:#487669;stroke-width:2}.tree-node text{stroke:none;fill:#183e43;font:600 23px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}.tree-node.leaf circle{fill:#245f58;stroke:#245f58}.tree-node.leaf text{fill:white}.tree-side{font:15px system-ui,sans-serif;fill:#4e6761;text-anchor:middle;paint-order:stroke;stroke:#fffef9;stroke-width:5;stroke-linejoin:round}.tree-node.is-visited circle{fill:#d9e9de;stroke:#356c58}.tree-node.is-visited text{fill:#173b32}.tree-node.is-current circle{fill:#f1c96b;stroke:#825e19;stroke-width:4}.tree-node.is-current text{fill:#3a2a0b}.tree-foot{font:16px system-ui,sans-serif;fill:#4e6761;text-anchor:middle}</style><path class="tree-edge" d="M380,48 L180,148" data-parent="A" data-child="B" data-side="左"/><text class="tree-side" x="280.0" y="91.0">左</text><path class="tree-edge" d="M380,48 L550,148" data-parent="A" data-child="F" data-side="右"/><text class="tree-side" x="465.0" y="91.0">右</text><path class="tree-edge" d="M180,148 L270,248" data-parent="B" data-child="C" data-side="右"/><text class="tree-side" x="225.0" y="191.0">右</text><path class="tree-edge" d="M270,248 L195,348" data-parent="C" data-child="D" data-side="左"/><text class="tree-side" x="232.5" y="291.0">左</text><path class="tree-edge" d="M270,248 L345,348" data-parent="C" data-child="E" data-side="右"/><text class="tree-side" x="307.5" y="291.0">右</text><path class="tree-edge" d="M550,148 L640,248" data-parent="F" data-child="G" data-side="右"/><text class="tree-side" x="595.0" y="191.0">右</text><path class="tree-edge" d="M640,248 L565,348" data-parent="G" data-child="H" data-side="左"/><text class="tree-side" x="602.5" y="291.0">左</text><g class="tree-node" transform="translate(380 48)" data-node="A"><circle r="26"/><text>A</text></g><g class="tree-node" transform="translate(180 148)" data-node="B"><circle r="26"/><text>B</text></g><g class="tree-node" transform="translate(550 148)" data-node="F"><circle r="26"/><text>F</text></g><g class="tree-node" transform="translate(270 248)" data-node="C"><circle r="26"/><text>C</text></g><g class="tree-node" transform="translate(640 248)" data-node="G"><circle r="26"/><text>G</text></g><g class="tree-node leaf" transform="translate(195 348)" data-node="D"><circle r="26"/><text>D</text></g><g class="tree-node leaf" transform="translate(345 348)" data-node="E"><circle r="26"/><text>E</text></g><g class="tree-node leaf" transform="translate(565 348)" data-node="H"><circle r="26"/><text>H</text></g><text class="tree-foot" x="390.0" y="395">先序：A → B → C → D → E → F → G → H</text></svg>