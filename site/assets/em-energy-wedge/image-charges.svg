<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="t d"><title id="t">本题六个点电荷与六十度物理角域</title><desc id="d">真正电荷Q1位于坐标一、一，角度四十五度；五个镜像均在零至六十度角域外。观察点P位于二、一。奇数号电荷为正、偶数号为负。各点与原点距离相同，但不是等角度间隔。</desc><rect width="960" height="650" fill="#fffef9"/><path d="M330 340L960 340L960 0L526.3 0Z" fill="#e6f3e6"/><path d="M330 340H860M330 340L526 0" stroke="#183e43" stroke-width="4"/><path d="M50 340H330M330 340V620" stroke="#becbc5" stroke-width="1.5" stroke-dasharray="6 6"/><circle cx="330" cy="340" r="184" fill="none" stroke="#c5d5cb" stroke-dasharray="5 6"/><path d="M400 340A70 70 0 0 0 365 279" stroke="#75998a" fill="none" stroke-width="2"/><g font-family="system-ui,sans-serif" fill="#183e43"><text x="30" y="40" font-size="23" font-weight="700">与本题坐标一致的镜像构造</text><text x="707" y="323" font-size="18">零电位边界 C</text><text x="535" y="85" font-size="18">零电位边界 B</text><text x="405" y="309" font-size="18">60°</text><text x="309" y="366" font-size="17">原点</text><text x="671" y="270" font-size="19">物理角域</text><circle cx="460.000" cy="210.000" r="12" fill="#b45535"/><text x="453.000" y="216.000" font-size="21" fill="white">+</text><text x="480.000" y="203.000" font-size="19">Q1（真实）</text><circle cx="377.583" cy="162.417" r="12" fill="#276b95"/><text x="370.583" y="168.417" font-size="21" fill="white">−</text><text x="397.583" y="155.417" font-size="19">Q2</text><circle cx="152.417" cy="292.417" r="12" fill="#b45535"/><text x="145.417" y="298.417" font-size="21" fill="white">+</text><text x="172.417" y="285.417" font-size="19">Q3</text><circle cx="152.417" cy="387.583" r="12" fill="#276b95"/><text x="145.417" y="393.583" font-size="21" fill="white">−</text><text x="172.417" y="380.583" font-size="19">Q4</text><circle cx="377.583" cy="517.583" r="12" fill="#b45535"/><text x="370.583" y="523.583" font-size="21" fill="white">+</text><text x="397.583" y="510.583" font-size="19">Q5</text><circle cx="460.000" cy="470.000" r="12" fill="#276b95"/><text x="453.000" y="476.000" font-size="21" fill="white">−</text><text x="480.000" y="463.000" font-size="19">Q6</text><circle cx="590" cy="210" r="7" fill="#183e43"/><text x="606" y="212" font-size="19">P（观察点）</text><text x="36" y="595" font-size="17">奇数号为正，偶数号为负；Q2—Q6 只用于计算，均在物理角域外。</text><text x="36" y="624" font-size="17">六点共圆，但相邻角间隔并不相等。精确坐标及距离见正文表格。</text></g></svg>