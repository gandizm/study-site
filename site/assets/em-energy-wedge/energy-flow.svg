<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="t d"><title id="t">导电介质中的电流、磁场和能流</title><desc id="d">左侧为圆板电容器轴向剖面，正极板在下、负极板在上，电场和电流向上，能量从圆柱侧面流入。右侧沿轴看，电流出纸面，磁场逆时针环绕轴线，能流径向向内。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#176b6f"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#b25a2b"/></marker></defs><rect width="960" height="490" fill="#fffef9"/><g font-family="system-ui,sans-serif" fill="#183e43"><text x="42" y="38" font-size="22" font-weight="700">轴向剖面</text><text x="552" y="38" font-size="22" font-weight="700">从负极板一侧看</text><rect x="150" y="130" width="220" height="210" fill="#e8f2e9" stroke="#9db9ab"/><path d="M130 126H390M130 344H390" stroke="#183e43" stroke-width="8"/><text x="205" y="104" font-size="19">负极板</text><text x="205" y="376" font-size="19">正极板</text><path d="M260 298V169" fill="none" stroke="#176b6f" stroke-width="5" marker-end="url(#a)"/><text x="273" y="220" font-size="18">电场</text><text x="273" y="246" font-size="18">电流</text><path d="M60 230H145" fill="none" stroke="#b25a2b" stroke-width="5" marker-end="url(#b)"/><path d="M460 230H376" fill="none" stroke="#b25a2b" stroke-width="5" marker-end="url(#b)"/><text x="42" y="207" fill="#a55327" font-size="17">能流进入</text><text x="389" y="207" fill="#a55327" font-size="17">能流进入</text><text x="157" y="408" font-size="17">介质内持续产生焦耳热</text><circle cx="725" cy="235" r="125" fill="#e8f2e9" stroke="#9db9ab"/><circle cx="725" cy="235" r="10" fill="#176b6f"/><circle cx="725" cy="235" r="23" fill="none" stroke="#176b6f" stroke-width="2"/><path d="M798 235A73 73 0 1 0 725 308" fill="none" stroke="#176b6f" stroke-width="4" marker-end="url(#a)"/><path d="M725 66V104" fill="none" stroke="#b25a2b" stroke-width="4" marker-end="url(#b)"/><path d="M894 235H857" fill="none" stroke="#b25a2b" stroke-width="4" marker-end="url(#b)"/><path d="M725 404V367" fill="none" stroke="#b25a2b" stroke-width="4" marker-end="url(#b)"/><path d="M556 235H593" fill="none" stroke="#b25a2b" stroke-width="4" marker-end="url(#b)"/><text x="645" y="443" font-size="17">圆心：电流出纸面</text><text x="645" y="469" font-size="17">圆周箭头：环向磁场</text><text x="42" y="464" font-size="15" fill="#536d6b">示意图，非按比例。采用课本轴对称近似，忽略边缘与馈线扰动。</text></g></svg>
