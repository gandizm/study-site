<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title>3.7-2 的区域与右边三角电位</title><desc>矩形0到a、0到b，左上下电位为零，右边f在0和b为零，在b/2达U0/2。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#355f6a"/></marker></defs><style>text{font-family:system-ui,'Noto Sans CJK SC',sans-serif;font-size:20px;fill:#173f49}.small{font-size:16px}.wall{fill:none;stroke:#254d57;stroke-width:4}.axis{stroke:#527580;stroke-width:1.5;marker-end:url(#arrow)}.value{fill:#b34c36}.curve{fill:none;stroke:#b34c36;stroke-width:4}.dash{stroke-dasharray:9 7}</style><rect width="960" height="410" rx="16" fill="#f6faf9"/><line class="axis" x1="70" y1="330" x2="440" y2="330"/><line class="axis" x1="70" y1="330" x2="70" y2="40"/><text x="445" y="337">x</text><text x="61" y="28">y</text><text x="49" y="354">O</text><text x="387" y="357">a</text><text x="45" y="85">b</text><path class="wall" d="M70 80V330H400"/><line class="curve" x1="400" y1="80" x2="400" y2="330"/><text x="95" y="210">φ=0</text><text x="205" y="313">φ=0</text><text class="value" x="412" y="207">φ=f(y)</text><line class="axis" x1="730" y1="330" x2="918" y2="330"/><line class="axis" x1="730" y1="330" x2="730" y2="40"/><text x="690" y="28">y</text><text class="small" x="838" y="363">右边电位 f(y)</text><text x="711" y="355">0</text><text x="704" y="87">b</text><line class="wall" x1="70" y1="80" x2="400" y2="80"/><text x="205" y="64">φ=0</text><path class="curve" d="M730 330L875 205L730 80"/><line x1="730" y1="205" x2="875" y2="205" stroke="#bdcfd1" stroke-dasharray="5 5"/><text x="681" y="211">b/2</text><text class="value" x="837" y="189">U₀/2</text><text class="small" x="70" y="390">按本题重绘：三条零电位边界；右边在中央达到 U₀/2。</text></svg>