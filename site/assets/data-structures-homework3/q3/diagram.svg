<rect x="650" y="160" width="376" height="384" rx="16" fill="#ffffff" stroke="#dce3ee"/>
<text x="674" y="199" font-size="20" font-weight="700">两个已知地址，先求行数</text>
<text x="674" y="238" font-size="17">1115 − 1110 = m − 1 = 5</text>
<text x="674" y="273" font-size="24" font-weight="700" class="given">m = 6</text>
<line x1="674" y1="297" x2="1002" y2="297" stroke="#e3e8f1"/>
<text x="674" y="333" font-size="18">再向右一列：+6</text>
<text x="674" y="367" font-size="18">同时向上一行：−1</text>
<text x="674" y="408" font-size="23" font-weight="700" class="target">1115 + 6 − 1 = 1120</text>
<text x="674" y="464" font-size="15" class="muted">行优先会得到n = −4，故不成立。</text>
<text x="674" y="493" font-size="15" class="muted">图中只展示前4列，并非断言n = 4。</text>
<text x="674" y="520" font-size="15" class="muted">所求元素存在需n ≥ 4。</text>
<text x="80" y="578" class="small muted">表中数字是地址；绿色为已知，紫色为所求。</text>

<rect x="80" y="606" width="230" height="86" rx="14" fill="#dcf3ee"/><text x="195" y="636" text-anchor="middle" font-size="17">A[3,2]</text><text x="195" y="674" text-anchor="middle" font-size="27" font-weight="700" style="fill:#087d72">1110</text>
<rect x="397" y="606" width="230" height="86" rx="14" fill="#dcf3ee"/><text x="512" y="636" text-anchor="middle" font-size="17">A[2,3]</text><text x="512" y="674" text-anchor="middle" font-size="27" font-weight="700" style="fill:#087d72">1115</text>
<rect x="714" y="606" width="230" height="86" rx="14" fill="#ede6ff"/><text x="829" y="636" text-anchor="middle" font-size="17">A[1,4]</text><text x="829" y="674" text-anchor="middle" font-size="27" font-weight="700" style="fill:#6541be">1120</text>
<text x="351" y="631" text-anchor="middle" class="small muted">+5</text><line x1="324" y1="651" x2="380" y2="651" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>
<text x="668" y="631" text-anchor="middle" class="small muted">+5</text><line x1="641" y1="651" x2="697" y2="651" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>
<text x="80" y="727" font-size="15" class="muted">两次都做同一件事：行号−1、列号+1 ⇒ 地址增加m−1 = 5。</text></svg>