<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc">
<title id="title">二维数组按列优先存储：A[1,4]的地址为1120</title>
<desc id="desc">六行数组的前四列地址表，已知A[3,2]地址1110和A[2,3]地址1115，所求A[1,4]地址1120。每次行号减一、列号加一，地址增加五。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#718096" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#15243e}.muted{fill:#5e6d82}.small{font-size:15px}.cell-label{font-size:12px;fill:#5e6d82}.addr{font-size:23px;font-weight:600}.given{fill:#087d72}.target{fill:#6541be}</style>
<rect width="1080" height="760" rx="20" fill="#f6f8fc"/>
<text x="54" y="60" font-size="30" font-weight="700">第3题 · 一次向右上，地址增加5</text>
<text x="54" y="96" font-size="17" class="muted">列优先存储：每列6行；先向下读完一列，再进入下一列。</text>

