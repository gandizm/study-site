<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img"><style>text{font-family:"Noto Sans CJK SC","Microsoft Yahei",sans-serif;fill:#203044;font-size:22px}.title{font-size:26px;font-weight:700}.small{font-size:18px}.tiny{font-size:16px}.blue{fill:#146a95}.red{fill:#a43845}.teal{fill:#067a70}.muted{fill:#607082}.axis{stroke:#53667c;stroke-width:2;fill:none}.line{stroke:#146a95;stroke-width:3;fill:none}.dash{stroke:#8798aa;stroke-width:1.5;stroke-dasharray:6 6;fill:none}</style><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#146a95"/></marker><marker id="redarr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a43845"/></marker><marker id="tealarr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#067a70"/></marker></defs><rect width="960" height="520" rx="20" fill="#f5f8fc"/><text x="35" y="45" class="title">电流连续性：净流出 = 内部电荷减少率</text><rect x="240" y="105" width="370" height="240" rx="45" fill="#e2eef6" stroke="#146a95" stroke-width="3"/><text x="330" y="180" class="title">固定体积 V</text><text x="330" y="222" class="small">内部总电荷 Q(t)</text><line x1="65" y1="228" x2="235" y2="228" stroke="#067a70" stroke-width="5" marker-end="url(#tealarr)"/><text x="65" y="205" class="teal">流入 2 A</text><line x1="615" y1="228" x2="830" y2="228" stroke="#a43845" stroke-width="5" marker-end="url(#redarr)"/><text x="660" y="205" class="red">流出 5 A</text><line x1="530" y1="110" x2="590" y2="70" stroke="#146a95" stroke-width="3" marker-end="url(#arr)"/><text x="608" y="85" class="small">外法线 n</text><text x="284" y="280" class="title">dQ/dt = 2 − 5 = −3 A</text><text x="45" y="403" class="title">积分法的几何关键</text><path d="M400 439Q540 330 680 439Q540 525 400 439Z" fill="#e1ecef" stroke="#146a95" stroke-width="2"/><ellipse cx="540" cy="439" rx="140" ry="22" fill="none" stroke="#a43845" stroke-width="2" stroke-dasharray="5 4"/><text x="525" y="405" class="small">S₁</text><text x="525" y="488" class="small">S₂</text><text x="710" y="421" class="small">公共边界：L 与 −L</text><text x="710" y="457" class="small">两环量相加抵消</text><text x="45" y="449" class="small">封闭面分成上下两片</text><text x="45" y="482" class="small">每片取该体积的外法向</text></svg>